<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective Game - Smartphone Scene</title>

    <!-- Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Arial', sans-serif;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 300px;
            z-index: 100;
        }

        #ui-overlay h2 {
            margin-bottom: 10px;
            color: #4CAF50;
        }

        #ui-overlay p {
            margin-bottom: 5px;
            line-height: 1.5;
        }

        #phone-status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 5px;
            border-left: 3px solid #4CAF50;
        }

        .status-ringing {
            background: rgba(255, 152, 0, 0.2) !important;
            border-left-color: #FF9800 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
        }

        #start-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        #start-button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="loading">
        <p>Loading scene...</p>
    </div>

    <button id="start-button">Click to Start</button>

    <canvas id="renderCanvas"></canvas>

    <div id="ui-overlay">
        <h2>🔍 Detective Game</h2>
        <p><strong>Scene:</strong> Office Desk</p>
        <p><strong>Controls:</strong></p>
        <p>• Click/tap the smartphone to answer</p>
        <p>• Mouse drag to rotate camera</p>
        <p>• Scroll to zoom</p>

        <div id="phone-status">
            <strong>Phone Status:</strong> <span id="status-text">Idle</span>
        </div>
    </div>

    <script>
        // ============================================
        // AudioManager Class
        // ============================================
        class AudioManager {
            constructor(scene) {
                this.scene = scene;
                this.sounds = new Map();
                this.musicVolume = 0.7;
                this.sfxVolume = 0.8;
                this.initialized = false;
                this.audioContext = null;
                this.ringPlaying = false;
            }

            async initialize() {
                console.log('Initializing AudioManager...');
                try {
                    this.initialized = true;
                    console.log('AudioManager initialized successfully');
                } catch (error) {
                    console.warn('Audio initialization warning:', error);
                    this.initialized = true;
                }
            }

            ensureAudioContext() {
                if (!this.audioContext && BABYLON.Engine.audioEngine && BABYLON.Engine.audioEngine.audioContext) {
                    this.audioContext = BABYLON.Engine.audioEngine.audioContext;
                }
            }

            playPhoneRing() {
                if (!this.initialized) {
                    console.warn('AudioManager not initialized');
                    return;
                }

                try {
                    this.ensureAudioContext();
                    if (!this.audioContext) {
                        console.warn('Audio context not available');
                        return;
                    }

                    console.log('Playing smartphone ringtone...');
                    this.ringPlaying = true;
                    this.playModernRingtone();
                } catch (error) {
                    console.warn('Could not play audio:', error);
                }
            }

            playModernRingtone() {
                if (!this.audioContext || !this.ringPlaying) return;

                const melody = [
                    { freq: 659, duration: 0.15 },  // E5
                    { freq: 523, duration: 0.15 },  // C5
                    { freq: 587, duration: 0.15 },  // D5
                    { freq: 440, duration: 0.2 },   // A4
                    { freq: 494, duration: 0.15 },  // B4
                    { freq: 523, duration: 0.15 },  // C5
                    { freq: 587, duration: 0.15 },  // D5
                    { freq: 659, duration: 0.3 }    // E5 (longer)
                ];

                const playMelody = () => {
                    if (!this.ringPlaying) return;

                    let time = this.audioContext.currentTime;

                    melody.forEach((note, index) => {
                        if (!this.ringPlaying) return;

                        try {
                            const osc1 = this.audioContext.createOscillator();
                            const osc2 = this.audioContext.createOscillator();
                            const gainNode = this.audioContext.createGain();

                            osc1.frequency.value = note.freq;
                            osc1.type = 'sine';

                            osc2.frequency.value = note.freq * 2;
                            osc2.type = 'sine';

                            osc1.connect(gainNode);
                            osc2.connect(gainNode);
                            gainNode.connect(this.audioContext.destination);

                            const startTime = time;
                            const endTime = time + note.duration;

                            gainNode.gain.setValueAtTime(0, startTime);
                            gainNode.gain.linearRampToValueAtTime(this.sfxVolume * 0.25, startTime + 0.02);
                            gainNode.gain.linearRampToValueAtTime(this.sfxVolume * 0.2, endTime - 0.05);
                            gainNode.gain.exponentialRampToValueAtTime(0.001, endTime);

                            const harmonicGain = this.audioContext.createGain();
                            harmonicGain.gain.value = 0.3;
                            osc2.disconnect();
                            osc2.connect(harmonicGain);
                            harmonicGain.connect(gainNode);

                            osc1.start(startTime);
                            osc2.start(startTime);
                            osc1.stop(endTime);
                            osc2.stop(endTime);

                            time += note.duration;

                        } catch (error) {
                            console.warn('Error playing note:', error);
                        }
                    });

                    setTimeout(() => {
                        if (!this.ringPlaying) return;
                        this.playVibrationSound();
                    }, (time - this.audioContext.currentTime) * 1000);

                    setTimeout(() => {
                        if (this.ringPlaying) {
                            playMelody();
                        }
                    }, 2500);
                };

                playMelody();
            }

            playVibrationSound() {
                if (!this.audioContext || !this.ringPlaying) return;

                try {
                    const osc = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();

                    osc.frequency.value = 80;
                    osc.type = 'sawtooth';

                    osc.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);

                    const now = this.audioContext.currentTime;

                    gainNode.gain.setValueAtTime(0, now);
                    gainNode.gain.linearRampToValueAtTime(this.sfxVolume * 0.1, now + 0.02);
                    gainNode.gain.linearRampToValueAtTime(0, now + 0.08);
                    gainNode.gain.linearRampToValueAtTime(this.sfxVolume * 0.1, now + 0.12);
                    gainNode.gain.linearRampToValueAtTime(0, now + 0.18);

                    osc.start(now);
                    osc.stop(now + 0.2);

                } catch (error) {
                    console.warn('Vibration sound error:', error);
                }
            }

            stopPhoneRing() {
                console.log('Stopping smartphone ringtone...');
                this.ringPlaying = false;
            }

            dispose() {
                this.stopPhoneRing();
                this.sounds.forEach(sound => sound.dispose());
                this.sounds.clear();
            }
        }

        // ============================================
        // TableObject Class
        // ============================================
        class TableObject {
            constructor(scene, position = new BABYLON.Vector3(0, 0, 0)) {
                this.scene = scene;
                this.position = position;
                this.mesh = null;
                this.initialize();
            }

            initialize() {
                console.log('Creating table object...');

                const tableTop = BABYLON.MeshBuilder.CreateBox('tableTop', {
                    width: 1.2,
                    height: 0.05,
                    depth: 0.8
                }, this.scene);
                tableTop.position.y = 0.75;

                const legPositions = [
                    { x: -0.5, z: -0.35 },
                    { x: 0.5, z: -0.35 },
                    { x: -0.5, z: 0.35 },
                    { x: 0.5, z: 0.35 }
                ];

                const legs = [];
                legPositions.forEach((pos, i) => {
                    const leg = BABYLON.MeshBuilder.CreateCylinder(`tableLeg${i}`, {
                        height: 0.75,
                        diameter: 0.05,
                        tessellation: 16
                    }, this.scene);
                    leg.position.x = pos.x;
                    leg.position.y = 0.375;
                    leg.position.z = pos.z;
                    legs.push(leg);
                });

                const rim = BABYLON.MeshBuilder.CreateBox('tableRim', {
                    width: 1.25,
                    height: 0.03,
                    depth: 0.85
                }, this.scene);
                rim.position.y = 0.725;

                this.mesh = BABYLON.Mesh.CreateBox('table', 0.01, this.scene);
                this.mesh.isVisible = false;

                tableTop.parent = this.mesh;
                rim.parent = this.mesh;
                legs.forEach(leg => leg.parent = this.mesh);

                const woodMaterial = new BABYLON.StandardMaterial('woodMaterial', this.scene);
                woodMaterial.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);
                woodMaterial.specularColor = new BABYLON.Color3(0.2, 0.15, 0.1);
                woodMaterial.specularPower = 16;

                const woodTexture = new BABYLON.DynamicTexture('woodTexture', 512, this.scene);
                const ctx = woodTexture.getContext();

                ctx.fillStyle = '#5C4033';
                ctx.fillRect(0, 0, 512, 512);

                for (let i = 0; i < 512; i += 2) {
                    const brightness = 0.3 + Math.random() * 0.2;
                    const color = Math.floor(brightness * 255);
                    ctx.strokeStyle = `rgb(${color * 0.4}, ${color * 0.25}, ${color * 0.15})`;
                    ctx.lineWidth = 1 + Math.random();
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(512, i + Math.sin(i * 0.1) * 3);
                    ctx.stroke();
                }

                woodTexture.update();
                woodMaterial.diffuseTexture = woodTexture;

                const legMaterial = new BABYLON.StandardMaterial('legMaterial', this.scene);
                legMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.12);
                legMaterial.specularColor = new BABYLON.Color3(0.15, 0.1, 0.05);

                tableTop.material = woodMaterial;
                rim.material = woodMaterial;
                legs.forEach(leg => leg.material = legMaterial);

                this.mesh.position = this.position;

                console.log('Table object created successfully');
            }

            getTopSurfaceY() {
                return this.position.y + 0.775;
            }

            dispose() {
                if (this.mesh) {
                    this.mesh.dispose();
                }
            }
        }

        // ============================================
        // PhoneObject Class (Smartphone)
        // ============================================
        class PhoneObject {
            constructor(scene, audioManager, position = new BABYLON.Vector3(0, 0.85, 0)) {
                this.scene = scene;
                this.audioManager = audioManager;
                this.position = position;
                this.mesh = null;
                this.isRinging = false;
                this.isPickedUp = false;
                this.shakeAnimation = null;
                this.originalPosition = position.clone();
                this.onPickUpCallback = null;
                this.screenLight = null;

                this.initialize();
            }

            initialize() {
                console.log('Creating smartphone object...');

                const phoneBody = BABYLON.MeshBuilder.CreateBox('phoneBody', {
                    width: 0.08,
                    height: 0.012,
                    depth: 0.16
                }, this.scene);

                const cornerRadius = 0.008;
                const corners = [];
                const cornerPositions = [
                    { x: 0.036, z: 0.076 }, { x: -0.036, z: 0.076 },
                    { x: 0.036, z: -0.076 }, { x: -0.036, z: -0.076 }
                ];

                cornerPositions.forEach((pos, i) => {
                    const corner = BABYLON.MeshBuilder.CreateSphere(`corner${i}`, {
                        diameter: cornerRadius * 2,
                        segments: 8
                    }, this.scene);
                    corner.position.x = pos.x;
                    corner.position.z = pos.z;
                    corner.position.y = 0;
                    corner.scaling.y = 0.3;
                    corners.push(corner);
                });

                const screen = BABYLON.MeshBuilder.CreateBox('screen', {
                    width: 0.072,
                    height: 0.002,
                    depth: 0.15
                }, this.scene);
                screen.position.y = 0.007;

                const bezel = BABYLON.MeshBuilder.CreateBox('bezel', {
                    width: 0.076,
                    height: 0.001,
                    depth: 0.154
                }, this.scene);
                bezel.position.y = 0.0065;

                const camera = BABYLON.MeshBuilder.CreateCylinder('camera', {
                    height: 0.002,
                    diameter: 0.006,
                    tessellation: 16
                }, this.scene);
                camera.rotation.x = Math.PI / 2;
                camera.position.y = 0.008;
                camera.position.z = 0.07;

                const lens = BABYLON.MeshBuilder.CreateCylinder('lens', {
                    height: 0.003,
                    diameter: 0.004,
                    tessellation: 16
                }, this.scene);
                lens.rotation.x = Math.PI / 2;
                lens.position.y = 0.0085;
                lens.position.z = 0.07;

                const speaker = BABYLON.MeshBuilder.CreateBox('speaker', {
                    width: 0.02,
                    height: 0.001,
                    depth: 0.002
                }, this.scene);
                speaker.position.y = 0.008;
                speaker.position.z = 0.065;

                const homeButton = BABYLON.MeshBuilder.CreateCylinder('homeButton', {
                    height: 0.001,
                    diameter: 0.01,
                    tessellation: 32
                }, this.scene);
                homeButton.rotation.x = Math.PI / 2;
                homeButton.position.y = 0.007;
                homeButton.position.z = -0.065;

                const volumeUp = BABYLON.MeshBuilder.CreateBox('volumeUp', {
                    width: 0.002,
                    height: 0.003,
                    depth: 0.015
                }, this.scene);
                volumeUp.position.x = 0.041;
                volumeUp.position.z = 0.03;

                const volumeDown = BABYLON.MeshBuilder.CreateBox('volumeDown', {
                    width: 0.002,
                    height: 0.003,
                    depth: 0.015
                }, this.scene);
                volumeDown.position.x = 0.041;
                volumeDown.position.z = 0.01;

                const powerButton = BABYLON.MeshBuilder.CreateBox('powerButton', {
                    width: 0.002,
                    height: 0.003,
                    depth: 0.012
                }, this.scene);
                powerButton.position.x = -0.041;
                powerButton.position.z = 0.02;

                this.mesh = BABYLON.Mesh.CreateBox('smartphone', 0.01, this.scene);
                this.mesh.isVisible = false;

                phoneBody.parent = this.mesh;
                screen.parent = this.mesh;
                bezel.parent = this.mesh;
                camera.parent = this.mesh;
                lens.parent = this.mesh;
                speaker.parent = this.mesh;
                homeButton.parent = this.mesh;
                volumeUp.parent = this.mesh;
                volumeDown.parent = this.mesh;
                powerButton.parent = this.mesh;
                corners.forEach(corner => corner.parent = this.mesh);

                const bodyMaterial = new BABYLON.StandardMaterial('bodyMaterial', this.scene);
                bodyMaterial.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.18);
                bodyMaterial.specularColor = new BABYLON.Color3(0.6, 0.6, 0.65);
                bodyMaterial.specularPower = 128;

                const screenMaterial = new BABYLON.StandardMaterial('screenMaterial', this.scene);
                screenMaterial.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.08);
                screenMaterial.specularColor = new BABYLON.Color3(0.8, 0.8, 0.9);
                screenMaterial.specularPower = 256;
                screenMaterial.emissiveColor = new BABYLON.Color3(0, 0, 0);

                const bezelMaterial = new BABYLON.StandardMaterial('bezelMaterial', this.scene);
                bezelMaterial.diffuseColor = new BABYLON.Color3(0.02, 0.02, 0.02);
                bezelMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);

                const cameraMaterial = new BABYLON.StandardMaterial('cameraMaterial', this.scene);
                cameraMaterial.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.05);
                cameraMaterial.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);

                const lensMaterial = new BABYLON.StandardMaterial('lensMaterial', this.scene);
                lensMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.15, 0.2);
                lensMaterial.specularColor = new BABYLON.Color3(0.9, 0.95, 1);
                lensMaterial.specularPower = 512;

                const buttonMaterial = new BABYLON.StandardMaterial('buttonMaterial', this.scene);
                buttonMaterial.diffuseColor = new BABYLON.Color3(0.12, 0.12, 0.14);
                buttonMaterial.specularColor = new BABYLON.Color3(0.4, 0.4, 0.45);

                phoneBody.material = bodyMaterial;
                screen.material = screenMaterial;
                bezel.material = bezelMaterial;
                camera.material = cameraMaterial;
                lens.material = lensMaterial;
                speaker.material = bezelMaterial;
                homeButton.material = buttonMaterial;
                volumeUp.material = buttonMaterial;
                volumeDown.material = buttonMaterial;
                powerButton.material = buttonMaterial;
                corners.forEach(corner => corner.material = bodyMaterial);

                this.screenMesh = screen;
                this.screenMaterial = screenMaterial;

                this.mesh.position = this.position;

                this.setupInteraction();

                console.log('Smartphone object created successfully');
            }

            setupInteraction() {
                this.mesh.getChildMeshes().forEach(mesh => {
                    mesh.isPickable = true;
                });

                this.mesh.actionManager = new BABYLON.ActionManager(this.scene);

                this.mesh.actionManager.registerAction(
                    new BABYLON.ExecuteCodeAction(
                        BABYLON.ActionManager.OnPickTrigger,
                        () => this.handlePickup()
                    )
                );

                this.mesh.getChildMeshes().forEach(childMesh => {
                    childMesh.actionManager = new BABYLON.ActionManager(this.scene);
                    childMesh.actionManager.registerAction(
                        new BABYLON.ExecuteCodeAction(
                            BABYLON.ActionManager.OnPickTrigger,
                            () => this.handlePickup()
                        )
                    );

                    childMesh.actionManager.registerAction(
                        new BABYLON.ExecuteCodeAction(
                            BABYLON.ActionManager.OnPointerOverTrigger,
                            () => {
                                if (this.isRinging) {
                                    this.scene.getEngine().getRenderingCanvas().style.cursor = 'pointer';
                                }
                            }
                        )
                    );

                    childMesh.actionManager.registerAction(
                        new BABYLON.ExecuteCodeAction(
                            BABYLON.ActionManager.OnPointerOutTrigger,
                            () => {
                                this.scene.getEngine().getRenderingCanvas().style.cursor = 'default';
                            }
                        )
                    );
                });
            }

            handlePickup() {
                if (this.isRinging) {
                    console.log('Phone answered!');
                    this.stopRinging();
                    this.isPickedUp = true;

                    if (this.onPickUpCallback) {
                        this.onPickUpCallback();
                    }
                }
            }

            startRinging() {
                if (this.isRinging) return;

                console.log('Smartphone is ringing...');
                this.isRinging = true;
                this.isPickedUp = false;

                this.audioManager.playPhoneRing();
                this.startVibrateAnimation();
                this.lightUpScreen();
                this.updatePhoneStatus('Ringing...', true);
            }

            stopRinging() {
                if (!this.isRinging) return;

                console.log('Smartphone stopped ringing');
                this.isRinging = false;

                this.audioManager.stopPhoneRing();
                this.stopVibrateAnimation();
                this.turnOffScreen();
                this.updatePhoneStatus('Answered', false);

                this.mesh.position = this.originalPosition.clone();
                this.mesh.rotation = BABYLON.Vector3.Zero();
            }

            lightUpScreen() {
                if (this.screenMaterial) {
                    let brightness = 0;
                    const maxBrightness = 0.4;

                    this.screenLightInterval = setInterval(() => {
                        if (!this.isRinging) return;

                        brightness = maxBrightness * (0.5 + 0.5 * Math.sin(Date.now() * 0.003));
                        this.screenMaterial.emissiveColor = new BABYLON.Color3(
                            brightness * 0.3,
                            brightness * 0.5,
                            brightness * 1.0
                        );
                    }, 16);
                }
            }

            turnOffScreen() {
                if (this.screenLightInterval) {
                    clearInterval(this.screenLightInterval);
                    this.screenLightInterval = null;
                }

                if (this.screenMaterial) {
                    this.screenMaterial.emissiveColor = new BABYLON.Color3(0, 0, 0);
                }
            }

            startVibrateAnimation() {
                const vibrateStrength = 0.003;
                const vibrateSpeed = 60;
                const rotationStrength = 0.02;

                let elapsed = 0;
                const startPosition = this.mesh.position.clone();
                const startRotation = this.mesh.rotation.clone();

                this.shakeAnimation = this.scene.onBeforeRenderObservable.add(() => {
                    if (!this.isRinging) return;

                    elapsed += this.scene.getEngine().getDeltaTime() / 1000;

                    const vibrateX = Math.sin(elapsed * vibrateSpeed) * vibrateStrength;
                    const vibrateZ = Math.cos(elapsed * vibrateSpeed * 1.5) * vibrateStrength;
                    const bounceY = Math.abs(Math.sin(elapsed * vibrateSpeed * 0.3)) * vibrateStrength * 0.3;
                    const rotationZ = Math.sin(elapsed * vibrateSpeed * 0.7) * rotationStrength;

                    this.mesh.position.x = startPosition.x + vibrateX;
                    this.mesh.position.y = startPosition.y + bounceY;
                    this.mesh.position.z = startPosition.z + vibrateZ;

                    this.mesh.rotation.z = startRotation.z + rotationZ;
                });
            }

            stopVibrateAnimation() {
                if (this.shakeAnimation) {
                    this.scene.onBeforeRenderObservable.remove(this.shakeAnimation);
                    this.shakeAnimation = null;
                }
            }

            updatePhoneStatus(status, isRinging) {
                const statusElement = document.getElementById('status-text');
                const statusContainer = document.getElementById('phone-status');

                if (statusElement) {
                    statusElement.textContent = status;
                }

                if (statusContainer) {
                    if (isRinging) {
                        statusContainer.classList.add('status-ringing');
                    } else {
                        statusContainer.classList.remove('status-ringing');
                    }
                }
            }

            setOnPickUpCallback(callback) {
                this.onPickUpCallback = callback;
            }

            dispose() {
                this.stopRinging();
                if (this.mesh) {
                    this.mesh.dispose();
                }
            }
        }

        // ============================================
        // GameManager Class
        // ============================================
        class GameManager {
            constructor(canvas) {
                this.canvas = canvas;
                this.engine = null;
                this.scene = null;
                this.camera = null;
                this.audioManager = null;
                this.phoneObject = null;
                this.tableObject = null;
            }

            async initialize() {
                console.log('Initializing game...');

                try {
                    this.updateLoadingStatus('Creating 3D engine...');

                    this.engine = new BABYLON.Engine(this.canvas, true, {
                        preserveDrawingBuffer: true,
                        stencil: true
                    });

                    this.scene = new BABYLON.Scene(this.engine);
                    this.scene.clearColor = new BABYLON.Color4(0.85, 0.88, 0.92, 1);

                    this.updateLoadingStatus('Setting up camera...');

                    this.camera = new BABYLON.ArcRotateCamera(
                        'camera',
                        Math.PI / 2,
                        Math.PI / 3,
                        2.5,
                        new BABYLON.Vector3(0, 0.8, 0),
                        this.scene
                    );

                    this.camera.attachControl(this.canvas, true);
                    this.camera.lowerRadiusLimit = 1.5;
                    this.camera.upperRadiusLimit = 4;
                    this.camera.lowerBetaLimit = 0.1;
                    this.camera.upperBetaLimit = Math.PI / 2;

                    this.updateLoadingStatus('Creating lights...');

                    this.setupLighting();

                    this.updateLoadingStatus('Initializing audio system...');

                    this.audioManager = new AudioManager(this.scene);
                    await this.audioManager.initialize();

                    this.updateLoadingStatus('Creating table...');

                    this.tableObject = new TableObject(this.scene, new BABYLON.Vector3(0, 0, 0));

                    this.updateLoadingStatus('Creating smartphone...');

                    const tableTop = this.tableObject.getTopSurfaceY();
                    this.phoneObject = new PhoneObject(
                        this.scene,
                        this.audioManager,
                        new BABYLON.Vector3(0, tableTop, 0)
                    );

                    this.phoneObject.setOnPickUpCallback(() => {
                        this.onPhonePickedUp();
                    });

                    this.updateLoadingStatus('Setting up environment...');

                    this.createGround();
                    this.createEnvironment();

                    this.updateLoadingStatus('Ready!');

                    setTimeout(() => {
                        const loadingElement = document.getElementById('loading');
                        const startButton = document.getElementById('start-button');
                        if (loadingElement) {
                            loadingElement.style.display = 'none';
                        }
                        if (startButton) {
                            startButton.style.display = 'block';
                        }
                    }, 500);

                    this.engine.runRenderLoop(() => {
                        this.scene.render();
                    });

                    window.addEventListener('resize', () => {
                        this.engine.resize();
                    });

                    console.log('Game initialized successfully!');

                } catch (error) {
                    console.error('Initialization error:', error);
                    this.updateLoadingStatus('Error: ' + error.message);
                    throw error;
                }
            }

            startGame() {
                const startButton = document.getElementById('start-button');
                if (startButton) {
                    startButton.style.display = 'none';
                }

                setTimeout(() => {
                    this.phoneObject.startRinging();
                }, 2000);
            }

            setupLighting() {
                const ambientLight = new BABYLON.HemisphericLight(
                    'ambientLight',
                    new BABYLON.Vector3(0, 1, 0),
                    this.scene
                );
                ambientLight.intensity = 0.9;
                ambientLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);
                ambientLight.specular = new BABYLON.Color3(0.5, 0.5, 0.5);

                const mainLight = new BABYLON.DirectionalLight(
                    'mainLight',
                    new BABYLON.Vector3(-1, -2, -1),
                    this.scene
                );
                mainLight.position = new BABYLON.Vector3(2, 3, 2);
                mainLight.intensity = 1.2;
                mainLight.diffuse = new BABYLON.Color3(1, 0.98, 0.92);

                const rimLight = new BABYLON.PointLight(
                    'rimLight',
                    new BABYLON.Vector3(-1, 2, 1),
                    this.scene
                );
                rimLight.intensity = 0.3;
                rimLight.diffuse = new BABYLON.Color3(0.8, 0.9, 1);

                const deskLamp = new BABYLON.SpotLight(
                    'deskLamp',
                    new BABYLON.Vector3(0.5, 2, -0.3),
                    new BABYLON.Vector3(0, -1, 0.2),
                    Math.PI / 3,
                    2,
                    this.scene
                );
                deskLamp.intensity = 0.5;
                deskLamp.diffuse = new BABYLON.Color3(1, 0.9, 0.7);
            }

            createGround() {
                const ground = BABYLON.MeshBuilder.CreateGround('ground', {
                    width: 10,
                    height: 10
                }, this.scene);

                const groundMaterial = new BABYLON.StandardMaterial('groundMaterial', this.scene);
                groundMaterial.diffuseColor = new BABYLON.Color3(0.75, 0.78, 0.82);
                groundMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);

                ground.material = groundMaterial;
                ground.receiveShadows = true;
            }

            createEnvironment() {
                const backWall = BABYLON.MeshBuilder.CreatePlane('backWall', {
                    width: 10,
                    height: 5
                }, this.scene);
                backWall.position.z = 3;
                backWall.position.y = 2.5;

                const wallMaterial = new BABYLON.StandardMaterial('wallMaterial', this.scene);
                wallMaterial.diffuseColor = new BABYLON.Color3(0.88, 0.90, 0.92);
                wallMaterial.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);

                backWall.material = wallMaterial;

                this.scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
                this.scene.fogColor = new BABYLON.Color3(0.85, 0.88, 0.92);
                this.scene.fogStart = 5.0;
                this.scene.fogEnd = 10.0;
            }

            updateLoadingStatus(status) {
                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    loadingElement.innerHTML = `<p>${status}</p>`;
                }
                console.log('Status:', status);
            }

            onPhonePickedUp() {
                console.log('Phone answered - triggering story event');

                setTimeout(() => {
                    this.phoneObject.updatePhoneStatus('Call ended', false);
                }, 3000);
            }

            dispose() {
                if (this.phoneObject) this.phoneObject.dispose();
                if (this.tableObject) this.tableObject.dispose();
                if (this.audioManager) this.audioManager.dispose();
                if (this.scene) this.scene.dispose();
                if (this.engine) this.engine.dispose();
            }
        }

        // ============================================
        // Main Entry Point
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('=== Detective Game Starting ===');

            const canvas = document.getElementById('renderCanvas');
            const startButton = document.getElementById('start-button');

            if (!canvas) {
                console.error('Canvas element not found!');
                return;
            }

            const gameManager = new GameManager(canvas);

            gameManager.initialize().catch(error => {
                console.error('Failed to initialize game:', error);

                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    loadingElement.innerHTML = `
                        <p style="color: #ff4444;">Error loading game:</p>
                        <p style="font-size: 14px;">${error.message}</p>
                        <p style="font-size: 12px; margin-top: 10px;">Check console (F12) for details.</p>
                    `;
                }
            });

            startButton.addEventListener('click', () => {
                gameManager.startGame();
            });

            window.addEventListener('beforeunload', () => {
                console.log('Cleaning up game resources...');
                gameManager.dispose();
            });
        });

        console.log('Detective Game module loaded');
    </script>
</body>
</html>
