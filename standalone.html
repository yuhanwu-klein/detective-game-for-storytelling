<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective Game - Phone Scene</title>

    <!-- Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Arial', sans-serif;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 300px;
            z-index: 100;
        }

        #ui-overlay h2 {
            margin-bottom: 10px;
            color: #4CAF50;
        }

        #ui-overlay p {
            margin-bottom: 5px;
            line-height: 1.5;
        }

        #phone-status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 5px;
            border-left: 3px solid #4CAF50;
        }

        .status-ringing {
            background: rgba(255, 152, 0, 0.2) !important;
            border-left-color: #FF9800 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
        }

        #start-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        #start-button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="loading">
        <p>Loading scene...</p>
    </div>

    <button id="start-button">Click to Start</button>

    <canvas id="renderCanvas"></canvas>

    <div id="ui-overlay">
        <h2>🔍 Detective Game</h2>
        <p><strong>Scene:</strong> Office Desk</p>
        <p><strong>Controls:</strong></p>
        <p>• Click/tap the phone to answer</p>
        <p>• Mouse drag to rotate camera</p>
        <p>• Scroll to zoom</p>

        <div id="phone-status">
            <strong>Phone Status:</strong> <span id="status-text">Idle</span>
        </div>
    </div>

    <script>
        // ============================================
        // AudioManager Class
        // ============================================
        class AudioManager {
            constructor(scene) {
                this.scene = scene;
                this.sounds = new Map();
                this.musicVolume = 0.7;
                this.sfxVolume = 0.8;
                this.initialized = false;
                this.audioContext = null;
            }

            async initialize() {
                console.log('Initializing AudioManager...');
                try {
                    // Audio context will be created on first user interaction
                    this.initialized = true;
                    console.log('AudioManager initialized successfully');
                } catch (error) {
                    console.warn('Audio initialization warning:', error);
                    this.initialized = true; // Continue anyway
                }
            }

            ensureAudioContext() {
                if (!this.audioContext && BABYLON.Engine.audioEngine && BABYLON.Engine.audioEngine.audioContext) {
                    this.audioContext = BABYLON.Engine.audioEngine.audioContext;
                }
            }

            playPhoneRing() {
                if (!this.initialized) {
                    console.warn('AudioManager not initialized');
                    return;
                }

                try {
                    this.ensureAudioContext();
                    if (!this.audioContext) {
                        console.warn('Audio context not available');
                        return;
                    }

                    console.log('Playing phone ring sound...');
                    this.ringPlaying = true;
                    this.playRingTone();
                } catch (error) {
                    console.warn('Could not play audio:', error);
                }
            }

            playRingTone() {
                if (!this.audioContext || !this.ringPlaying) return;

                const playBurst = () => {
                    if (!this.ringPlaying) return;

                    try {
                        const osc1 = this.audioContext.createOscillator();
                        const osc2 = this.audioContext.createOscillator();
                        const gainNode = this.audioContext.createGain();

                        osc1.frequency.value = 440;
                        osc2.frequency.value = 480;
                        osc1.type = 'sine';
                        osc2.type = 'sine';

                        osc1.connect(gainNode);
                        osc2.connect(gainNode);
                        gainNode.connect(this.audioContext.destination);

                        gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                        gainNode.gain.linearRampToValueAtTime(this.sfxVolume * 0.3, this.audioContext.currentTime + 0.05);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.4);

                        osc1.start(this.audioContext.currentTime);
                        osc2.start(this.audioContext.currentTime);
                        osc1.stop(this.audioContext.currentTime + 0.4);
                        osc2.stop(this.audioContext.currentTime + 0.4);

                        setTimeout(() => {
                            if (!this.ringPlaying) return;

                            const osc3 = this.audioContext.createOscillator();
                            const osc4 = this.audioContext.createOscillator();
                            const gainNode2 = this.audioContext.createGain();

                            osc3.frequency.value = 440;
                            osc4.frequency.value = 480;
                            osc3.type = 'sine';
                            osc4.type = 'sine';

                            osc3.connect(gainNode2);
                            osc4.connect(gainNode2);
                            gainNode2.connect(this.audioContext.destination);

                            gainNode2.gain.setValueAtTime(0, this.audioContext.currentTime);
                            gainNode2.gain.linearRampToValueAtTime(this.sfxVolume * 0.3, this.audioContext.currentTime + 0.05);
                            gainNode2.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.4);

                            osc3.start(this.audioContext.currentTime);
                            osc4.start(this.audioContext.currentTime);
                            osc3.stop(this.audioContext.currentTime + 0.4);
                            osc4.stop(this.audioContext.currentTime + 0.4);
                        }, 500);

                        setTimeout(() => {
                            if (this.ringPlaying) {
                                playBurst();
                            }
                        }, 2000);
                    } catch (error) {
                        console.warn('Audio playback error:', error);
                    }
                };

                playBurst();
            }

            stopPhoneRing() {
                console.log('Stopping phone ring sound...');
                this.ringPlaying = false;
            }

            dispose() {
                this.stopPhoneRing();
                this.sounds.forEach(sound => sound.dispose());
                this.sounds.clear();
            }
        }

        // ============================================
        // TableObject Class
        // ============================================
        class TableObject {
            constructor(scene, position = new BABYLON.Vector3(0, 0, 0)) {
                this.scene = scene;
                this.position = position;
                this.mesh = null;
                this.initialize();
            }

            initialize() {
                console.log('Creating table object...');

                const tableTop = BABYLON.MeshBuilder.CreateBox('tableTop', {
                    width: 1.2,
                    height: 0.05,
                    depth: 0.8
                }, this.scene);
                tableTop.position.y = 0.75;

                const legPositions = [
                    { x: -0.5, z: -0.35 },
                    { x: 0.5, z: -0.35 },
                    { x: -0.5, z: 0.35 },
                    { x: 0.5, z: 0.35 }
                ];

                const legs = [];
                legPositions.forEach((pos, i) => {
                    const leg = BABYLON.MeshBuilder.CreateCylinder(`tableLeg${i}`, {
                        height: 0.75,
                        diameter: 0.05,
                        tessellation: 16
                    }, this.scene);
                    leg.position.x = pos.x;
                    leg.position.y = 0.375;
                    leg.position.z = pos.z;
                    legs.push(leg);
                });

                const rim = BABYLON.MeshBuilder.CreateBox('tableRim', {
                    width: 1.25,
                    height: 0.03,
                    depth: 0.85
                }, this.scene);
                rim.position.y = 0.725;

                this.mesh = BABYLON.Mesh.CreateBox('table', 0.01, this.scene);
                this.mesh.isVisible = false;

                tableTop.parent = this.mesh;
                rim.parent = this.mesh;
                legs.forEach(leg => leg.parent = this.mesh);

                const woodMaterial = new BABYLON.StandardMaterial('woodMaterial', this.scene);
                woodMaterial.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);
                woodMaterial.specularColor = new BABYLON.Color3(0.2, 0.15, 0.1);
                woodMaterial.specularPower = 16;

                const woodTexture = new BABYLON.DynamicTexture('woodTexture', 512, this.scene);
                const ctx = woodTexture.getContext();

                ctx.fillStyle = '#5C4033';
                ctx.fillRect(0, 0, 512, 512);

                for (let i = 0; i < 512; i += 2) {
                    const brightness = 0.3 + Math.random() * 0.2;
                    const color = Math.floor(brightness * 255);
                    ctx.strokeStyle = `rgb(${color * 0.4}, ${color * 0.25}, ${color * 0.15})`;
                    ctx.lineWidth = 1 + Math.random();
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(512, i + Math.sin(i * 0.1) * 3);
                    ctx.stroke();
                }

                woodTexture.update();
                woodMaterial.diffuseTexture = woodTexture;

                const legMaterial = new BABYLON.StandardMaterial('legMaterial', this.scene);
                legMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.12);
                legMaterial.specularColor = new BABYLON.Color3(0.15, 0.1, 0.05);

                tableTop.material = woodMaterial;
                rim.material = woodMaterial;
                legs.forEach(leg => leg.material = legMaterial);

                this.mesh.position = this.position;

                console.log('Table object created successfully');
            }

            getTopSurfaceY() {
                return this.position.y + 0.775;
            }

            dispose() {
                if (this.mesh) {
                    this.mesh.dispose();
                }
            }
        }

        // ============================================
        // OfficeEnvironment Class (Detective Office)
        // ============================================
        class OfficeEnvironment {
            constructor(scene) {
                this.scene = scene;
                this.meshes = [];
                this.initialize();
            }

            initialize() {
                console.log('Creating detective office environment...');
                this.createFloor();
                this.createWalls();
                this.createWindow();
                this.createDoor();
                this.createFilingCabinet();
                this.createBookshelf();
                this.createCoatRack();
                this.createWallDecorations();
                this.createCeiling();
                console.log('Detective office environment created successfully');
            }

            createFloor() {
                const floor = BABYLON.MeshBuilder.CreateGround('floor', {
                    width: 8,
                    height: 8
                }, this.scene);

                const floorTexture = new BABYLON.DynamicTexture('floorTexture', 512, this.scene);
                const ctx = floorTexture.getContext();

                ctx.fillStyle = '#3D2817';
                ctx.fillRect(0, 0, 512, 512);

                for (let y = 0; y < 512; y += 64) {
                    const plankShade = 0.2 + Math.random() * 0.15;
                    ctx.fillStyle = `rgb(${Math.floor(61 * plankShade)}, ${Math.floor(40 * plankShade)}, ${Math.floor(23 * plankShade)})`;
                    ctx.fillRect(0, y, 512, 60);

                    ctx.strokeStyle = `rgba(0, 0, 0, ${0.1 + Math.random() * 0.1})`;
                    ctx.lineWidth = 1;
                    for (let x = 0; x < 512; x += 4) {
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + Math.random() * 8, y + 60);
                        ctx.stroke();
                    }

                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, y + 62);
                    ctx.lineTo(512, y + 62);
                    ctx.stroke();
                }

                const floorMaterial = new BABYLON.StandardMaterial('floorMaterial', this.scene);
                floorMaterial.diffuseTexture = floorTexture;
                floorMaterial.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                floorMaterial.diffuseTexture.uScale = 3;
                floorMaterial.diffuseTexture.vScale = 3;

                floor.material = floorMaterial;
                floor.receiveShadows = true;
                this.meshes.push(floor);
            }

            createWalls() {
                const wallHeight = 3.5;
                const wallMaterial = new BABYLON.StandardMaterial('wallMaterial', this.scene);
                wallMaterial.diffuseColor = new BABYLON.Color3(0.82, 0.78, 0.72);
                wallMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                const backWall = BABYLON.MeshBuilder.CreatePlane('backWall', {
                    width: 8,
                    height: wallHeight
                }, this.scene);
                backWall.position.z = 4;
                backWall.position.y = wallHeight / 2;
                backWall.material = wallMaterial;
                this.meshes.push(backWall);

                const leftWall = BABYLON.MeshBuilder.CreatePlane('leftWall', {
                    width: 8,
                    height: wallHeight
                }, this.scene);
                leftWall.position.x = -4;
                leftWall.position.y = wallHeight / 2;
                leftWall.rotation.y = Math.PI / 2;
                leftWall.material = wallMaterial;
                this.meshes.push(leftWall);

                const rightWall = BABYLON.MeshBuilder.CreatePlane('rightWall', {
                    width: 8,
                    height: wallHeight
                }, this.scene);
                rightWall.position.x = 4;
                rightWall.position.y = wallHeight / 2;
                rightWall.rotation.y = -Math.PI / 2;
                rightWall.material = wallMaterial;
                this.meshes.push(rightWall);

                this.createBaseboard(-4, 4, 0, 8, Math.PI / 2);
                this.createBaseboard(4, 4, 0, 8, -Math.PI / 2);
                this.createBaseboard(0, 4, 4, 8, 0);
            }

            createBaseboard(x, z, y, width, rotationY) {
                const baseboard = BABYLON.MeshBuilder.CreateBox('baseboard', {
                    width: width,
                    height: 0.15,
                    depth: 0.05
                }, this.scene);
                baseboard.position.x = x;
                baseboard.position.z = z;
                baseboard.position.y = 0.075;
                baseboard.rotation.y = rotationY;

                const baseboardMaterial = new BABYLON.StandardMaterial('baseboardMaterial', this.scene);
                baseboardMaterial.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.88);
                baseboard.material = baseboardMaterial;
                this.meshes.push(baseboard);
            }

            createWindow() {
                const windowX = -2;
                const windowY = 2;
                const windowZ = 3.95;

                const frame = BABYLON.MeshBuilder.CreateBox('windowFrame', {
                    width: 1.8,
                    height: 2,
                    depth: 0.1
                }, this.scene);
                frame.position.set(windowX, windowY, windowZ);

                const frameMaterial = new BABYLON.StandardMaterial('frameMaterial', this.scene);
                frameMaterial.diffuseColor = new BABYLON.Color3(0.25, 0.2, 0.15);
                frame.material = frameMaterial;
                this.meshes.push(frame);

                const glass = BABYLON.MeshBuilder.CreatePlane('windowGlass', {
                    width: 1.6,
                    height: 1.8
                }, this.scene);
                glass.position.set(windowX, windowY, windowZ + 0.06);

                const glassMaterial = new BABYLON.StandardMaterial('glassMaterial', this.scene);
                glassMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.8, 0.9);
                glassMaterial.specularColor = new BABYLON.Color3(0.9, 0.9, 1);
                glassMaterial.alpha = 0.3;
                glass.material = glassMaterial;
                this.meshes.push(glass);

                const blindsMaterial = new BABYLON.StandardMaterial('blindsMaterial', this.scene);
                blindsMaterial.diffuseColor = new BABYLON.Color3(0.85, 0.82, 0.75);
                blindsMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);

                const numSlats = 20;
                const slatHeight = 0.04;
                const slatSpacing = 1.8 / numSlats;

                for (let i = 0; i < numSlats; i++) {
                    const slat = BABYLON.MeshBuilder.CreateBox(`blind${i}`, {
                        width: 1.5,
                        height: slatHeight,
                        depth: 0.01
                    }, this.scene);

                    const yPos = windowY - 0.9 + (i * slatSpacing);
                    slat.position.set(windowX, yPos, windowZ + 0.08);
                    slat.rotation.x = Math.PI / 12;
                    slat.material = blindsMaterial;
                    this.meshes.push(slat);
                }

                const cord = BABYLON.MeshBuilder.CreateCylinder('blindCord', {
                    height: 2.2,
                    diameter: 0.015
                }, this.scene);
                cord.position.set(windowX + 0.7, windowY - 0.1, windowZ + 0.1);

                const cordMaterial = new BABYLON.StandardMaterial('cordMaterial', this.scene);
                cordMaterial.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.85);
                cord.material = cordMaterial;
                this.meshes.push(cord);
            }

            createDoor() {
                const doorX = 3;
                const doorY = 1.2;
                const doorZ = 3.95;

                const doorFrame = BABYLON.MeshBuilder.CreateBox('doorFrame', {
                    width: 1.1,
                    height: 2.4,
                    depth: 0.15
                }, this.scene);
                doorFrame.position.set(doorX, doorY, doorZ);

                const frameMaterial = new BABYLON.StandardMaterial('doorFrameMaterial', this.scene);
                frameMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.25, 0.2);
                doorFrame.material = frameMaterial;
                this.meshes.push(doorFrame);

                const door = BABYLON.MeshBuilder.CreateBox('door', {
                    width: 1.0,
                    height: 2.3,
                    depth: 0.08
                }, this.scene);
                door.position.set(doorX, doorY, doorZ + 0.04);

                const doorMaterial = new BABYLON.StandardMaterial('doorMaterial', this.scene);
                doorMaterial.diffuseColor = new BABYLON.Color3(0.35, 0.28, 0.22);
                doorMaterial.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                door.material = doorMaterial;
                this.meshes.push(door);

                const knob = BABYLON.MeshBuilder.CreateSphere('doorKnob', {
                    diameter: 0.08
                }, this.scene);
                knob.position.set(doorX - 0.4, doorY, doorZ + 0.09);

                const knobMaterial = new BABYLON.StandardMaterial('knobMaterial', this.scene);
                knobMaterial.diffuseColor = new BABYLON.Color3(0.6, 0.5, 0.3);
                knobMaterial.specularColor = new BABYLON.Color3(0.8, 0.7, 0.5);
                knobMaterial.specularPower = 128;
                knob.material = knobMaterial;
                this.meshes.push(knob);

                const doorWindow = BABYLON.MeshBuilder.CreateBox('doorWindow', {
                    width: 0.4,
                    height: 0.6,
                    depth: 0.02
                }, this.scene);
                doorWindow.position.set(doorX + 0.1, doorY + 0.8, doorZ + 0.08);

                const doorWindowMaterial = new BABYLON.StandardMaterial('doorWindowMaterial', this.scene);
                doorWindowMaterial.diffuseColor = new BABYLON.Color3(0.8, 0.8, 0.75);
                doorWindowMaterial.alpha = 0.6;
                doorWindow.material = doorWindowMaterial;
                this.meshes.push(doorWindow);
            }

            createFilingCabinet() {
                const cabinetX = 3.5;
                const cabinetZ = 2;

                const cabinet = BABYLON.MeshBuilder.CreateBox('cabinet', {
                    width: 0.6,
                    height: 1.2,
                    depth: 0.5
                }, this.scene);
                cabinet.position.set(cabinetX, 0.6, cabinetZ);

                const cabinetMaterial = new BABYLON.StandardMaterial('cabinetMaterial', this.scene);
                cabinetMaterial.diffuseColor = new BABYLON.Color3(0.4, 0.4, 0.42);
                cabinetMaterial.specularColor = new BABYLON.Color3(0.5, 0.5, 0.52);
                cabinetMaterial.specularPower = 64;
                cabinet.material = cabinetMaterial;
                this.meshes.push(cabinet);

                const handleMaterial = new BABYLON.StandardMaterial('handleMaterial', this.scene);
                handleMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.32);

                for (let i = 0; i < 3; i++) {
                    const handle = BABYLON.MeshBuilder.CreateBox('handle', {
                        width: 0.3,
                        height: 0.04,
                        depth: 0.04
                    }, this.scene);
                    handle.position.set(cabinetX, 0.3 + (i * 0.3), cabinetZ + 0.27);
                    handle.material = handleMaterial;
                    this.meshes.push(handle);

                    const drawerLine = BABYLON.MeshBuilder.CreateBox('drawerLine', {
                        width: 0.58,
                        height: 0.02,
                        depth: 0.01
                    }, this.scene);
                    drawerLine.position.set(cabinetX, 0.1 + (i * 0.3), cabinetZ + 0.26);
                    drawerLine.material = handleMaterial;
                    this.meshes.push(drawerLine);
                }
            }

            createBookshelf() {
                const shelfX = -3.5;
                const shelfZ = 2;

                const shelf = BABYLON.MeshBuilder.CreateBox('bookshelf', {
                    width: 1.0,
                    height: 2.0,
                    depth: 0.35
                }, this.scene);
                shelf.position.set(shelfX, 1.0, shelfZ);

                const shelfMaterial = new BABYLON.StandardMaterial('shelfMaterial', this.scene);
                shelfMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.22, 0.15);
                shelf.material = shelfMaterial;
                this.meshes.push(shelf);

                const shelfBoardMaterial = new BABYLON.StandardMaterial('shelfBoardMaterial', this.scene);
                shelfBoardMaterial.diffuseColor = new BABYLON.Color3(0.35, 0.25, 0.18);

                for (let i = 0; i < 4; i++) {
                    const board = BABYLON.MeshBuilder.CreateBox('shelfBoard', {
                        width: 0.95,
                        height: 0.03,
                        depth: 0.3
                    }, this.scene);
                    board.position.set(shelfX, 0.2 + (i * 0.5), shelfZ);
                    board.material = shelfBoardMaterial;
                    this.meshes.push(board);
                }

                const bookColors = [
                    new BABYLON.Color3(0.6, 0.2, 0.2),
                    new BABYLON.Color3(0.2, 0.3, 0.6),
                    new BABYLON.Color3(0.3, 0.5, 0.2),
                    new BABYLON.Color3(0.5, 0.3, 0.1),
                    new BABYLON.Color3(0.4, 0.2, 0.4),
                ];

                for (let shelfNum = 0; shelfNum < 3; shelfNum++) {
                    for (let i = 0; i < 8; i++) {
                        const book = BABYLON.MeshBuilder.CreateBox('book', {
                            width: 0.08,
                            height: 0.25 + Math.random() * 0.1,
                            depth: 0.2
                        }, this.scene);

                        const xOffset = -0.4 + (i * 0.11);
                        const yPos = 0.35 + (shelfNum * 0.5);
                        book.position.set(shelfX + xOffset, yPos, shelfZ);
                        book.rotation.y = (Math.random() - 0.5) * 0.1;

                        const bookMaterial = new BABYLON.StandardMaterial('bookMaterial', this.scene);
                        bookMaterial.diffuseColor = bookColors[Math.floor(Math.random() * bookColors.length)];
                        book.material = bookMaterial;
                        this.meshes.push(book);
                    }
                }
            }

            createCoatRack() {
                const rackX = 3.2;
                const rackZ = -3.5;

                const pole = BABYLON.MeshBuilder.CreateCylinder('coatRackPole', {
                    height: 2.0,
                    diameter: 0.08
                }, this.scene);
                pole.position.set(rackX, 1.0, rackZ);

                const poleMaterial = new BABYLON.StandardMaterial('poleMaterial', this.scene);
                poleMaterial.diffuseColor = new BABYLON.Color3(0.15, 0.12, 0.1);
                pole.material = poleMaterial;
                this.meshes.push(pole);

                const base = BABYLON.MeshBuilder.CreateCylinder('coatRackBase', {
                    height: 0.05,
                    diameter: 0.4
                }, this.scene);
                base.position.set(rackX, 0.025, rackZ);
                base.material = poleMaterial;
                this.meshes.push(base);

                const hookMaterial = new BABYLON.StandardMaterial('hookMaterial', this.scene);
                hookMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.18, 0.15);

                for (let i = 0; i < 4; i++) {
                    const hook = BABYLON.MeshBuilder.CreateCylinder('hook', {
                        height: 0.3,
                        diameter: 0.04
                    }, this.scene);
                    hook.position.set(rackX, 1.7, rackZ);
                    hook.rotation.z = Math.PI / 2;
                    hook.rotation.y = (i * Math.PI / 2);
                    hook.material = hookMaterial;
                    this.meshes.push(hook);
                }

                const hatCrown = BABYLON.MeshBuilder.CreateCylinder('hatCrown', {
                    height: 0.15,
                    diameterTop: 0.2,
                    diameterBottom: 0.22
                }, this.scene);
                hatCrown.position.set(rackX + 0.15, 1.85, rackZ);

                const hatMaterial = new BABYLON.StandardMaterial('hatMaterial', this.scene);
                hatMaterial.diffuseColor = new BABYLON.Color3(0.25, 0.22, 0.2);
                hatCrown.material = hatMaterial;
                this.meshes.push(hatCrown);

                const hatBrim = BABYLON.MeshBuilder.CreateCylinder('hatBrim', {
                    height: 0.02,
                    diameter: 0.4
                }, this.scene);
                hatBrim.position.set(rackX + 0.15, 1.78, rackZ);
                hatBrim.material = hatMaterial;
                this.meshes.push(hatBrim);
            }

            createWallDecorations() {
                this.createFrame(-0.5, 2.5, 3.92, 0.4, 0.6);
                this.createFrame(0.5, 2.2, 3.92, 0.3, 0.3);
                this.createClock(0, 3.0, 3.92);
            }

            createFrame(x, y, z, width, height) {
                const frame = BABYLON.MeshBuilder.CreateBox('frame', {
                    width: width + 0.04,
                    height: height + 0.04,
                    depth: 0.03
                }, this.scene);
                frame.position.set(x, y, z);

                const frameMaterial = new BABYLON.StandardMaterial('frameMaterial', this.scene);
                frameMaterial.diffuseColor = new BABYLON.Color3(0.15, 0.12, 0.1);
                frame.material = frameMaterial;
                this.meshes.push(frame);

                const picture = BABYLON.MeshBuilder.CreatePlane('picture', {
                    width: width,
                    height: height
                }, this.scene);
                picture.position.set(x, y, z + 0.02);

                const pictureMaterial = new BABYLON.StandardMaterial('pictureMaterial', this.scene);
                pictureMaterial.diffuseColor = new BABYLON.Color3(0.85, 0.82, 0.75);
                picture.material = pictureMaterial;
                this.meshes.push(picture);
            }

            createClock(x, y, z) {
                const clockFace = BABYLON.MeshBuilder.CreateCylinder('clockFace', {
                    height: 0.05,
                    diameter: 0.35
                }, this.scene);
                clockFace.rotation.x = Math.PI / 2;
                clockFace.position.set(x, y, z);

                const clockMaterial = new BABYLON.StandardMaterial('clockMaterial', this.scene);
                clockMaterial.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.92);
                clockMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                clockFace.material = clockMaterial;
                this.meshes.push(clockFace);

                const rim = BABYLON.MeshBuilder.CreateTorus('clockRim', {
                    diameter: 0.35,
                    thickness: 0.02,
                    tessellation: 32
                }, this.scene);
                rim.rotation.x = Math.PI / 2;
                rim.position.set(x, y, z + 0.01);

                const rimMaterial = new BABYLON.StandardMaterial('rimMaterial', this.scene);
                rimMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                rim.material = rimMaterial;
                this.meshes.push(rim);

                const hourHand = BABYLON.MeshBuilder.CreateBox('hourHand', {
                    width: 0.02,
                    height: 0.12,
                    depth: 0.01
                }, this.scene);
                hourHand.position.set(x, y, z + 0.03);
                hourHand.rotation.z = -Math.PI / 6;

                const handMaterial = new BABYLON.StandardMaterial('handMaterial', this.scene);
                handMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                hourHand.material = handMaterial;
                this.meshes.push(hourHand);

                const minuteHand = BABYLON.MeshBuilder.CreateBox('minuteHand', {
                    width: 0.015,
                    height: 0.15,
                    depth: 0.01
                }, this.scene);
                minuteHand.position.set(x, y, z + 0.04);
                minuteHand.rotation.z = Math.PI / 3;
                minuteHand.material = handMaterial;
                this.meshes.push(minuteHand);

                const center = BABYLON.MeshBuilder.CreateCylinder('clockCenter', {
                    height: 0.01,
                    diameter: 0.03
                }, this.scene);
                center.rotation.x = Math.PI / 2;
                center.position.set(x, y, z + 0.05);
                center.material = handMaterial;
                this.meshes.push(center);
            }

            createCeiling() {
                const ceiling = BABYLON.MeshBuilder.CreateGround('ceiling', {
                    width: 8,
                    height: 8
                }, this.scene);
                ceiling.position.y = 3.5;
                ceiling.rotation.x = Math.PI;

                const ceilingMaterial = new BABYLON.StandardMaterial('ceilingMaterial', this.scene);
                ceilingMaterial.diffuseColor = new BABYLON.Color3(0.92, 0.90, 0.88);
                ceilingMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                ceiling.material = ceilingMaterial;
                this.meshes.push(ceiling);
            }

            dispose() {
                this.meshes.forEach(mesh => mesh.dispose());
                this.meshes = [];
            }
        }

        // ============================================
        // PhoneObject Class (Smartphone)
        // ============================================
        class PhoneObject {
            constructor(scene, audioManager, position = new BABYLON.Vector3(0, 0.85, 0)) {
                this.scene = scene;
                this.audioManager = audioManager;
                this.position = position;
                this.mesh = null;
                this.isRinging = false;
                this.isPickedUp = false;
                this.shakeAnimation = null;
                this.originalPosition = position.clone();
                this.onPickUpCallback = null;

                this.initialize();
            }

            initialize() {
                console.log('Creating phone object...');

                const phoneBody = BABYLON.MeshBuilder.CreateBox('phoneBody', {
                    width: 0.15,
                    height: 0.05,
                    depth: 0.25
                }, this.scene);

                const handset = BABYLON.MeshBuilder.CreateCylinder('handset', {
                    height: 0.2,
                    diameter: 0.04,
                    tessellation: 16
                }, this.scene);
                handset.rotation.x = Math.PI / 2;
                handset.rotation.z = Math.PI / 6;
                handset.position.y = 0.04;
                handset.position.x = -0.02;

                const earpiece = BABYLON.MeshBuilder.CreateSphere('earpiece', {
                    diameter: 0.05,
                    segments: 16
                }, this.scene);
                earpiece.position.y = 0.04;
                earpiece.position.x = 0.06;
                earpiece.position.z = 0.08;

                const mouthpiece = BABYLON.MeshBuilder.CreateSphere('mouthpiece', {
                    diameter: 0.05,
                    segments: 16
                }, this.scene);
                mouthpiece.position.y = 0.04;
                mouthpiece.position.x = -0.1;
                mouthpiece.position.z = -0.08;

                const buttons = [];
                const buttonPositions = [
                    [-0.04, 0.04], [0, 0.04], [0.04, 0.04],
                    [-0.04, 0], [0, 0], [0.04, 0],
                    [-0.04, -0.04], [0, -0.04], [0.04, -0.04],
                    [-0.04, -0.08], [0, -0.08], [0.04, -0.08]
                ];

                buttonPositions.forEach((pos, i) => {
                    const button = BABYLON.MeshBuilder.CreateCylinder(`button${i}`, {
                        height: 0.01,
                        diameter: 0.02,
                        tessellation: 16
                    }, this.scene);
                    button.position.x = pos[0];
                    button.position.y = 0.031;
                    button.position.z = pos[1];
                    buttons.push(button);
                });

                const cordPath = [];
                for (let i = 0; i < 20; i++) {
                    const angle = i * Math.PI / 4;
                    cordPath.push(new BABYLON.Vector3(
                        -0.075 + Math.cos(angle) * 0.01,
                        0.025 - i * 0.003,
                        -0.12 + i * 0.005
                    ));
                }
                const cord = BABYLON.MeshBuilder.CreateTube('cord', {
                    path: cordPath,
                    radius: 0.002,
                    tessellation: 8,
                    cap: BABYLON.Mesh.CAP_ALL
                }, this.scene);

                this.mesh = BABYLON.Mesh.CreateBox('phone', 0.01, this.scene);
                this.mesh.isVisible = false;

                phoneBody.parent = this.mesh;
                handset.parent = this.mesh;
                earpiece.parent = this.mesh;
                mouthpiece.parent = this.mesh;
                cord.parent = this.mesh;
                buttons.forEach(button => button.parent = this.mesh);

                const phoneMaterial = new BABYLON.StandardMaterial('phoneMaterial', this.scene);
                phoneMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                phoneMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                phoneMaterial.specularPower = 64;

                const handsetMaterial = new BABYLON.StandardMaterial('handsetMaterial', this.scene);
                handsetMaterial.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.15);

                const buttonMaterial = new BABYLON.StandardMaterial('buttonMaterial', this.scene);
                buttonMaterial.diffuseColor = new BABYLON.Color3(0.8, 0.8, 0.8);
                buttonMaterial.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                const cordMaterial = new BABYLON.StandardMaterial('cordMaterial', this.scene);
                cordMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                phoneBody.material = phoneMaterial;
                handset.material = handsetMaterial;
                earpiece.material = handsetMaterial;
                mouthpiece.material = handsetMaterial;
                cord.material = cordMaterial;
                buttons.forEach(button => button.material = buttonMaterial);

                this.mesh.position = this.position;

                this.setupInteraction();

                console.log('Phone object created successfully');
            }

            setupInteraction() {
                this.mesh.getChildMeshes().forEach(mesh => {
                    mesh.isPickable = true;
                });

                this.mesh.actionManager = new BABYLON.ActionManager(this.scene);

                this.mesh.actionManager.registerAction(
                    new BABYLON.ExecuteCodeAction(
                        BABYLON.ActionManager.OnPickTrigger,
                        () => this.handlePickup()
                    )
                );

                this.mesh.getChildMeshes().forEach(childMesh => {
                    childMesh.actionManager = new BABYLON.ActionManager(this.scene);
                    childMesh.actionManager.registerAction(
                        new BABYLON.ExecuteCodeAction(
                            BABYLON.ActionManager.OnPickTrigger,
                            () => this.handlePickup()
                        )
                    );

                    childMesh.actionManager.registerAction(
                        new BABYLON.ExecuteCodeAction(
                            BABYLON.ActionManager.OnPointerOverTrigger,
                            () => {
                                if (this.isRinging) {
                                    this.scene.getEngine().getRenderingCanvas().style.cursor = 'pointer';
                                }
                            }
                        )
                    );

                    childMesh.actionManager.registerAction(
                        new BABYLON.ExecuteCodeAction(
                            BABYLON.ActionManager.OnPointerOutTrigger,
                            () => {
                                this.scene.getEngine().getRenderingCanvas().style.cursor = 'default';
                            }
                        )
                    );
                });
            }

            handlePickup() {
                if (this.isRinging) {
                    console.log('Phone answered!');
                    this.stopRinging();
                    this.isPickedUp = true;

                    if (this.onPickUpCallback) {
                        this.onPickUpCallback();
                    }
                }
            }

            startRinging() {
                if (this.isRinging) return;

                console.log('Phone is ringing...');
                this.isRinging = true;
                this.isPickedUp = false;

                this.audioManager.playPhoneRing();
                this.startShakeAnimation();
                this.updatePhoneStatus('Ringing...', true);
            }

            stopRinging() {
                if (!this.isRinging) return;

                console.log('Phone stopped ringing');
                this.isRinging = false;

                this.audioManager.stopPhoneRing();
                this.stopShakeAnimation();
                this.updatePhoneStatus('Answered', false);

                this.mesh.position = this.originalPosition.clone();
                this.mesh.rotation = BABYLON.Vector3.Zero();
            }

            startShakeAnimation() {
                const shakeStrength = 0.008;
                const shakeSpeed = 30;
                const rotationStrength = 0.05;

                let elapsed = 0;
                const startPosition = this.mesh.position.clone();
                const startRotation = this.mesh.rotation.clone();

                this.shakeAnimation = this.scene.onBeforeRenderObservable.add(() => {
                    if (!this.isRinging) return;

                    elapsed += this.scene.getEngine().getDeltaTime() / 1000;

                    const shakeX = Math.sin(elapsed * shakeSpeed) * shakeStrength;
                    const shakeZ = Math.cos(elapsed * shakeSpeed * 1.3) * shakeStrength;
                    const bounceY = Math.abs(Math.sin(elapsed * shakeSpeed * 0.5)) * shakeStrength * 0.5;
                    const rotationY = Math.sin(elapsed * shakeSpeed * 0.8) * rotationStrength;
                    const rotationZ = Math.cos(elapsed * shakeSpeed * 1.1) * rotationStrength * 0.5;

                    this.mesh.position.x = startPosition.x + shakeX;
                    this.mesh.position.y = startPosition.y + bounceY;
                    this.mesh.position.z = startPosition.z + shakeZ;

                    this.mesh.rotation.y = startRotation.y + rotationY;
                    this.mesh.rotation.z = startRotation.z + rotationZ;
                });
            }

            stopShakeAnimation() {
                if (this.shakeAnimation) {
                    this.scene.onBeforeRenderObservable.remove(this.shakeAnimation);
                    this.shakeAnimation = null;
                }
            }

            updatePhoneStatus(status, isRinging) {
                const statusElement = document.getElementById('status-text');
                const statusContainer = document.getElementById('phone-status');

                if (statusElement) {
                    statusElement.textContent = status;
                }

                if (statusContainer) {
                    if (isRinging) {
                        statusContainer.classList.add('status-ringing');
                    } else {
                        statusContainer.classList.remove('status-ringing');
                    }
                }
            }

            setOnPickUpCallback(callback) {
                this.onPickUpCallback = callback;
            }

            dispose() {
                this.stopRinging();
                if (this.mesh) {
                    this.mesh.dispose();
                }
            }
        }

        // ============================================
        // GameManager Class
        // ============================================
        class GameManager {
            constructor(canvas) {
                this.canvas = canvas;
                this.engine = null;
                this.scene = null;
                this.camera = null;
                this.audioManager = null;
                this.phoneObject = null;
                this.tableObject = null;
                this.officeEnvironment = null;
                this.initialCameraRadius = 2.5;
                this.initialCameraAlpha = Math.PI / 2;
                this.initialCameraBeta = Math.PI / 3;
            }

            async initialize() {
                console.log('Initializing game...');

                try {
                    this.updateLoadingStatus('Creating 3D engine...');

                    this.engine = new BABYLON.Engine(this.canvas, true, {
                        preserveDrawingBuffer: true,
                        stencil: true
                    });

                    this.scene = new BABYLON.Scene(this.engine);
                    this.scene.clearColor = new BABYLON.Color4(0.85, 0.88, 0.92, 1);

                    this.updateLoadingStatus('Setting up camera...');

                    this.camera = new BABYLON.ArcRotateCamera(
                        'camera',
                        Math.PI / 2,
                        Math.PI / 3,
                        2.5,
                        new BABYLON.Vector3(0, 0.8, 0),
                        this.scene
                    );

                    this.camera.attachControl(this.canvas, true);
                    this.camera.lowerRadiusLimit = 1.5;
                    this.camera.upperRadiusLimit = 4;
                    this.camera.lowerBetaLimit = 0.1;
                    this.camera.upperBetaLimit = Math.PI / 2;

                    this.updateLoadingStatus('Creating lights...');

                    this.setupLighting();

                    this.updateLoadingStatus('Initializing audio system...');

                    this.audioManager = new AudioManager(this.scene);
                    await this.audioManager.initialize();

                    this.updateLoadingStatus('Creating table...');

                    this.tableObject = new TableObject(this.scene, new BABYLON.Vector3(0, 0, 0));

                    this.updateLoadingStatus('Creating phone...');

                    const tableTop = this.tableObject.getTopSurfaceY();
                    this.phoneObject = new PhoneObject(
                        this.scene,
                        this.audioManager,
                        new BABYLON.Vector3(0, tableTop, 0)
                    );

                    this.phoneObject.setOnPickUpCallback(() => {
                        this.onPhonePickedUp();
                    });

                    this.updateLoadingStatus('Setting up environment...');

                    // Create complete detective office environment
                    this.officeEnvironment = new OfficeEnvironment(this.scene);

                    this.updateLoadingStatus('Ready!');

                    // Hide loading, show start button
                    setTimeout(() => {
                        const loadingElement = document.getElementById('loading');
                        const startButton = document.getElementById('start-button');
                        if (loadingElement) {
                            loadingElement.style.display = 'none';
                        }
                        if (startButton) {
                            startButton.style.display = 'block';
                        }
                    }, 500);

                    this.engine.runRenderLoop(() => {
                        this.scene.render();
                    });

                    window.addEventListener('resize', () => {
                        this.engine.resize();
                    });

                    console.log('Game initialized successfully!');

                } catch (error) {
                    console.error('Initialization error:', error);
                    this.updateLoadingStatus('Error: ' + error.message);
                    throw error;
                }
            }

            startGame() {
                // Hide start button
                const startButton = document.getElementById('start-button');
                if (startButton) {
                    startButton.style.display = 'none';
                }

                // Start phone ringing after delay
                setTimeout(() => {
                    this.phoneObject.startRinging();
                }, 2000);
            }

            setupLighting() {
                const ambientLight = new BABYLON.HemisphericLight(
                    'ambientLight',
                    new BABYLON.Vector3(0, 1, 0),
                    this.scene
                );
                ambientLight.intensity = 0.9;
                ambientLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);
                ambientLight.specular = new BABYLON.Color3(0.5, 0.5, 0.5);

                const mainLight = new BABYLON.DirectionalLight(
                    'mainLight',
                    new BABYLON.Vector3(-1, -2, -1),
                    this.scene
                );
                mainLight.position = new BABYLON.Vector3(2, 3, 2);
                mainLight.intensity = 1.2;
                mainLight.diffuse = new BABYLON.Color3(1, 0.98, 0.92);

                const rimLight = new BABYLON.PointLight(
                    'rimLight',
                    new BABYLON.Vector3(-1, 2, 1),
                    this.scene
                );
                rimLight.intensity = 0.3;
                rimLight.diffuse = new BABYLON.Color3(0.8, 0.9, 1);

                const deskLamp = new BABYLON.SpotLight(
                    'deskLamp',
                    new BABYLON.Vector3(0.5, 2, -0.3),
                    new BABYLON.Vector3(0, -1, 0.2),
                    Math.PI / 3,
                    2,
                    this.scene
                );
                deskLamp.intensity = 0.5;
                deskLamp.diffuse = new BABYLON.Color3(1, 0.9, 0.7);
            }

            updateLoadingStatus(status) {
                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    loadingElement.innerHTML = `<p>${status}</p>`;
                }
                console.log('Status:', status);
            }

            onPhonePickedUp() {
                console.log('Phone answered - triggering story event');

                setTimeout(() => {
                    this.phoneObject.updatePhoneStatus('Call ended', false);
                }, 3000);
            }

            dispose() {
                if (this.phoneObject) this.phoneObject.dispose();
                if (this.tableObject) this.tableObject.dispose();
                if (this.officeEnvironment) this.officeEnvironment.dispose();
                if (this.audioManager) this.audioManager.dispose();
                if (this.scene) this.scene.dispose();
                if (this.engine) this.engine.dispose();
            }
        }

        // ============================================
        // Main Entry Point
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('=== Detective Game Starting ===');

            const canvas = document.getElementById('renderCanvas');
            const startButton = document.getElementById('start-button');

            if (!canvas) {
                console.error('Canvas element not found!');
                return;
            }

            const gameManager = new GameManager(canvas);

            gameManager.initialize().catch(error => {
                console.error('Failed to initialize game:', error);

                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    loadingElement.innerHTML = `
                        <p style="color: #ff4444;">Error loading game:</p>
                        <p style="font-size: 14px;">${error.message}</p>
                        <p style="font-size: 12px; margin-top: 10px;">Check console (F12) for details.</p>
                    `;
                }
            });

            // Start button click handler
            startButton.addEventListener('click', () => {
                gameManager.startGame();
            });

            window.addEventListener('beforeunload', () => {
                console.log('Cleaning up game resources...');
                gameManager.dispose();
            });
        });

        console.log('Detective Game module loaded');
    </script>
</body>
