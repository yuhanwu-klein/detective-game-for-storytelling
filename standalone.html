<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective Game - Phone Scene</title>

    <!-- Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1a1a1a;
            font-family: 'Arial', sans-serif;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            font-size: 14px;
            max-width: 300px;
            z-index: 100;
        }

        #ui-overlay h2 {
            margin-bottom: 10px;
            color: #4CAF50;
        }

        #ui-overlay p {
            margin-bottom: 5px;
            line-height: 1.5;
        }

        #phone-status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 5px;
            border-left: 3px solid #4CAF50;
        }

        .status-ringing {
            background: rgba(255, 152, 0, 0.2) !important;
            border-left-color: #FF9800 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
        }

        #start-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        #start-button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="loading">
        <p>Loading scene...</p>
    </div>

    <button id="start-button">Click to Start</button>

    <canvas id="renderCanvas"></canvas>

    <div id="ui-overlay">
        <h2>🔍 Detective Game</h2>
        <p><strong>Scene:</strong> Office Desk</p>
        <p><strong>Controls:</strong></p>
        <p>• Click/tap the phone to answer</p>
        <p>• Mouse drag to rotate camera</p>
        <p>• Scroll to zoom</p>

        <div id="phone-status">
            <strong>Phone Status:</strong> <span id="status-text">Idle</span>
        </div>
    </div>

    <script>
        // ============================================
        // AudioManager Class
        // ============================================
        class AudioManager {
            constructor(scene) {
                this.scene = scene;
                this.sounds = new Map();
                this.musicVolume = 0.5;
                this.sfxVolume = 0.8;
                this.initialized = false;
                this.audioContext = null;
                this.backgroundMusic = null;
            }

            async initialize() {
                console.log('Initializing AudioManager...');
                try {
                    // Audio context will be created on first user interaction
                    this.loadBackgroundMusic();
                    this.initialized = true;
                    console.log('AudioManager initialized successfully');
                } catch (error) {
                    console.warn('Audio initialization warning:', error);
                    this.initialized = true; // Continue anyway
                }
            }

            loadBackgroundMusic() {
                try {
                    this.backgroundMusic = new BABYLON.Sound(
                        'backgroundMusic',
                        './mixkit-echoes-188.mp3',
                        this.scene,
                        () => {
                            console.log('Background music loaded successfully');
                        },
                        {
                            loop: true,
                            autoplay: false,
                            volume: this.musicVolume
                        }
                    );
                } catch (error) {
                    console.warn('Could not load background music:', error);
                }
            }

            playBackgroundMusic() {
                if (this.backgroundMusic && !this.backgroundMusic.isPlaying) {
                    console.log('Starting background music...');
                    this.backgroundMusic.play();
                }
            }

            stopBackgroundMusic() {
                if (this.backgroundMusic && this.backgroundMusic.isPlaying) {
                    console.log('Stopping background music...');
                    this.backgroundMusic.stop();
                }
            }

            setMusicVolume(volume) {
                this.musicVolume = Math.max(0, Math.min(1, volume));
                if (this.backgroundMusic) {
                    this.backgroundMusic.setVolume(this.musicVolume);
                }
            }

            ensureAudioContext() {
                if (!this.audioContext && BABYLON.Engine.audioEngine && BABYLON.Engine.audioEngine.audioContext) {
                    this.audioContext = BABYLON.Engine.audioEngine.audioContext;
                }
            }

            playPhoneRing() {
                if (!this.initialized) {
                    console.warn('AudioManager not initialized');
                    return;
                }

                try {
                    this.ensureAudioContext();
                    if (!this.audioContext) {
                        console.warn('Audio context not available');
                        return;
                    }

                    console.log('Playing phone ring sound...');
                    this.ringPlaying = true;
                    this.playRingTone();
                } catch (error) {
                    console.warn('Could not play audio:', error);
                }
            }

            playRingTone() {
                if (!this.audioContext || !this.ringPlaying) return;

                const playBurst = () => {
                    if (!this.ringPlaying) return;

                    try {
                        const osc1 = this.audioContext.createOscillator();
                        const osc2 = this.audioContext.createOscillator();
                        const gainNode = this.audioContext.createGain();

                        osc1.frequency.value = 440;
                        osc2.frequency.value = 480;
                        osc1.type = 'sine';
                        osc2.type = 'sine';

                        osc1.connect(gainNode);
                        osc2.connect(gainNode);
                        gainNode.connect(this.audioContext.destination);

                        gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                        gainNode.gain.linearRampToValueAtTime(this.sfxVolume * 0.3, this.audioContext.currentTime + 0.05);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.4);

                        osc1.start(this.audioContext.currentTime);
                        osc2.start(this.audioContext.currentTime);
                        osc1.stop(this.audioContext.currentTime + 0.4);
                        osc2.stop(this.audioContext.currentTime + 0.4);

                        setTimeout(() => {
                            if (!this.ringPlaying) return;

                            const osc3 = this.audioContext.createOscillator();
                            const osc4 = this.audioContext.createOscillator();
                            const gainNode2 = this.audioContext.createGain();

                            osc3.frequency.value = 440;
                            osc4.frequency.value = 480;
                            osc3.type = 'sine';
                            osc4.type = 'sine';

                            osc3.connect(gainNode2);
                            osc4.connect(gainNode2);
                            gainNode2.connect(this.audioContext.destination);

                            gainNode2.gain.setValueAtTime(0, this.audioContext.currentTime);
                            gainNode2.gain.linearRampToValueAtTime(this.sfxVolume * 0.3, this.audioContext.currentTime + 0.05);
                            gainNode2.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.4);

                            osc3.start(this.audioContext.currentTime);
                            osc4.start(this.audioContext.currentTime);
                            osc3.stop(this.audioContext.currentTime + 0.4);
                            osc4.stop(this.audioContext.currentTime + 0.4);
                        }, 500);

                        setTimeout(() => {
                            if (this.ringPlaying) {
                                playBurst();
                            }
                        }, 2000);
                    } catch (error) {
                        console.warn('Audio playback error:', error);
                    }
                };

                playBurst();
            }

            stopPhoneRing() {
                console.log('Stopping phone ring sound...');
                this.ringPlaying = false;
            }

            dispose() {
                this.stopPhoneRing();
                this.stopBackgroundMusic();
                if (this.backgroundMusic) {
                    this.backgroundMusic.dispose();
                    this.backgroundMusic = null;
                }
                this.sounds.forEach(sound => sound.dispose());
                this.sounds.clear();
            }
        }

        // ============================================
        // TableObject Class
        // ============================================
        class TableObject {
            constructor(scene, position = new BABYLON.Vector3(0, 0, 0)) {
                this.scene = scene;
                this.position = position;
                this.mesh = null;
                this.initialize();
            }

            initialize() {
                console.log('Creating table object...');

                const tableTop = BABYLON.MeshBuilder.CreateBox('tableTop', {
                    width: 1.2,
                    height: 0.05,
                    depth: 0.8
                }, this.scene);
                tableTop.position.y = 0.75;

                const legPositions = [
                    { x: -0.5, z: -0.35 },
                    { x: 0.5, z: -0.35 },
                    { x: -0.5, z: 0.35 },
                    { x: 0.5, z: 0.35 }
                ];

                const legs = [];
                legPositions.forEach((pos, i) => {
                    const leg = BABYLON.MeshBuilder.CreateCylinder(`tableLeg${i}`, {
                        height: 0.75,
                        diameter: 0.05,
                        tessellation: 16
                    }, this.scene);
                    leg.position.x = pos.x;
                    leg.position.y = 0.375;
                    leg.position.z = pos.z;
                    legs.push(leg);
                });

                const rim = BABYLON.MeshBuilder.CreateBox('tableRim', {
                    width: 1.25,
                    height: 0.03,
                    depth: 0.85
                }, this.scene);
                rim.position.y = 0.725;

                this.mesh = BABYLON.Mesh.CreateBox('table', 0.01, this.scene);
                this.mesh.isVisible = false;

                tableTop.parent = this.mesh;
                rim.parent = this.mesh;
                legs.forEach(leg => leg.parent = this.mesh);

                const woodMaterial = new BABYLON.StandardMaterial('woodMaterial', this.scene);
                woodMaterial.diffuseColor = new BABYLON.Color3(0.4, 0.25, 0.15);
                woodMaterial.specularColor = new BABYLON.Color3(0.2, 0.15, 0.1);
                woodMaterial.specularPower = 16;

                const woodTexture = new BABYLON.DynamicTexture('woodTexture', 512, this.scene);
                const ctx = woodTexture.getContext();

                ctx.fillStyle = '#5C4033';
                ctx.fillRect(0, 0, 512, 512);

                for (let i = 0; i < 512; i += 2) {
                    const brightness = 0.3 + Math.random() * 0.2;
                    const color = Math.floor(brightness * 255);
                    ctx.strokeStyle = `rgb(${color * 0.4}, ${color * 0.25}, ${color * 0.15})`;
                    ctx.lineWidth = 1 + Math.random();
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(512, i + Math.sin(i * 0.1) * 3);
                    ctx.stroke();
                }

                woodTexture.update();
                woodMaterial.diffuseTexture = woodTexture;

                const legMaterial = new BABYLON.StandardMaterial('legMaterial', this.scene);
                legMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.2, 0.12);
                legMaterial.specularColor = new BABYLON.Color3(0.15, 0.1, 0.05);

                tableTop.material = woodMaterial;
                rim.material = woodMaterial;
                legs.forEach(leg => leg.material = legMaterial);

                this.mesh.position = this.position;

                console.log('Table object created successfully');
            }

            getTopSurfaceY() {
                return this.position.y + 0.775;
            }

            dispose() {
                if (this.mesh) {
                    this.mesh.dispose();
                }
            }
        }

        // ============================================
        // OfficeEnvironment Class (Detective Office)
        // Enhanced with compact layout, rich materials, and detailed models
        // ============================================
        /**
         * Creates a detailed, compact detective office environment
         * with rich materials and enhanced details
         */
        class OfficeEnvironment {
            constructor(scene) {
                this.scene = scene;
                this.meshes = [];
                this.materials = {};

                this.initialize();
            }

            /**
             * Initialize the complete office environment
             */
            initialize() {
                console.log('Creating detailed detective office environment...');

                // Create all materials first
                this.createMaterials();

                // Build compact environment (smaller room: 5x6 instead of 8x8)
                this.createFloor();
                this.createWalls();
                this.createWindow();
                this.createDoor();
                this.createFilingCabinet();
                this.createBookshelf();
                this.createCoatRack();
                this.createInvestigationBoard(); // New! Detective case board
                this.createDeskLamp(); // New! Desk lamp detail
                this.createWallDecorations();
                this.createCeiling();

                console.log('Detailed detective office environment created successfully');
            }

            /**
             * Create material library with rich, varied textures
             */
            createMaterials() {
                // Wood material - warm, aged wood
                this.materials.wood = new BABYLON.StandardMaterial('woodMat', this.scene);
                this.materials.wood.diffuseColor = new BABYLON.Color3(0.42, 0.28, 0.15);
                this.materials.wood.specularColor = new BABYLON.Color3(0.25, 0.18, 0.1);
                this.materials.wood.specularPower = 32;

                // Dark wood for shelves - rich mahogany
                this.materials.darkWood = new BABYLON.StandardMaterial('darkWoodMat', this.scene);
                this.materials.darkWood.diffuseColor = new BABYLON.Color3(0.22, 0.13, 0.08);
                this.materials.darkWood.specularColor = new BABYLON.Color3(0.3, 0.2, 0.12);
                this.materials.darkWood.specularPower = 64;

                // Metal - brushed steel
                this.materials.metal = new BABYLON.StandardMaterial('metalMat', this.scene);
                this.materials.metal.diffuseColor = new BABYLON.Color3(0.38, 0.38, 0.4);
                this.materials.metal.specularColor = new BABYLON.Color3(0.75, 0.75, 0.75);
                this.materials.metal.specularPower = 128;

                // Brass - aged brass for handles
                this.materials.brass = new BABYLON.StandardMaterial('brassMat', this.scene);
                this.materials.brass.diffuseColor = new BABYLON.Color3(0.65, 0.5, 0.22);
                this.materials.brass.specularColor = new BABYLON.Color3(0.85, 0.7, 0.45);
                this.materials.brass.specularPower = 256;

                // Paper/document material
                this.materials.paper = new BABYLON.StandardMaterial('paperMat', this.scene);
                this.materials.paper.diffuseColor = new BABYLON.Color3(0.9, 0.87, 0.8);
                this.materials.paper.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);

                // Leather - worn brown leather
                this.materials.leather = new BABYLON.StandardMaterial('leatherMat', this.scene);
                this.materials.leather.diffuseColor = new BABYLON.Color3(0.28, 0.18, 0.12);
                this.materials.leather.specularColor = new BABYLON.Color3(0.12, 0.08, 0.05);
                this.materials.leather.specularPower = 16;

                // Glass - translucent
                this.materials.glass = new BABYLON.StandardMaterial('glassMat', this.scene);
                this.materials.glass.diffuseColor = new BABYLON.Color3(0.7, 0.78, 0.85);
                this.materials.glass.specularColor = new BABYLON.Color3(0.9, 0.9, 1);
                this.materials.glass.alpha = 0.35;

                // Cork board material
                this.materials.cork = new BABYLON.StandardMaterial('corkMat', this.scene);
                this.materials.cork.diffuseColor = new BABYLON.Color3(0.65, 0.5, 0.35);
                this.materials.cork.specularColor = new BABYLON.Color3(0.1, 0.08, 0.05);
                this.materials.cork.specularPower = 8;
            }

            /**
             * Create wooden floor with realistic texture
             */
            createFloor() {
                const floor = BABYLON.MeshBuilder.CreateGround('floor', {
                    width: 5,
                    height: 6
                }, this.scene);

                // Enhanced procedural wood texture
                const floorTexture = new BABYLON.DynamicTexture('floorTexture', 512, this.scene);
                const ctx = floorTexture.getContext();

                // Base wood color
                ctx.fillStyle = '#2D1810';
                ctx.fillRect(0, 0, 512, 512);

                // Create realistic wood planks
                const plankHeight = 42;
                for (let y = 0; y < 512; y += plankHeight) {
                    // Vary each plank's color slightly
                    const shade = 0.18 + Math.random() * 0.12;
                    const r = Math.floor(45 * shade);
                    const g = Math.floor(24 * shade);
                    const b = Math.floor(16 * shade);

                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.fillRect(0, y, 512, plankHeight - 2);

                    // Add wood grain detail
                    for (let x = 0; x < 512; x += 8) {
                        ctx.strokeStyle = `rgba(0, 0, 0, ${0.08 + Math.random() * 0.08})`;
                        ctx.lineWidth = 1 + Math.random();
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        const waveIntensity = 3 + Math.random() * 4;
                        ctx.bezierCurveTo(
                            x + 128, y + Math.sin(x * 0.02) * waveIntensity,
                            x + 256, y + Math.cos(x * 0.03) * waveIntensity,
                            x + 384, y + plankHeight
                        );
                        ctx.stroke();
                    }

                    // Plank gaps
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                    ctx.fillRect(0, y + plankHeight - 2, 512, 2);

                    // Add knots randomly
                    if (Math.random() > 0.7) {
                        const knotX = Math.random() * 512;
                        const knotY = y + Math.random() * plankHeight;
                        ctx.fillStyle = `rgba(20, 10, 5, ${0.3 + Math.random() * 0.2})`;
                        ctx.beginPath();
                        ctx.ellipse(knotX, knotY, 8, 6, Math.random() * Math.PI, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                const floorMaterial = new BABYLON.StandardMaterial('floorMaterial', this.scene);
                floorMaterial.diffuseTexture = floorTexture;
                floorMaterial.specularColor = new BABYLON.Color3(0.15, 0.12, 0.1);
                floorMaterial.diffuseTexture.uScale = 2.5;
                floorMaterial.diffuseTexture.vScale = 3;

                floor.material = floorMaterial;
                floor.receiveShadows = true;
                this.meshes.push(floor);
            }

            /**
             * Create walls for compact room
             */
            createWalls() {
                const wallHeight = 3.2;

                // Wall material with slight texture variation
                const wallMaterial = new BABYLON.StandardMaterial('wallMaterial', this.scene);
                wallMaterial.diffuseColor = new BABYLON.Color3(0.78, 0.74, 0.68);
                wallMaterial.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);

                // Back wall
                const backWall = BABYLON.MeshBuilder.CreatePlane('backWall', {
                    width: 5,
                    height: wallHeight
                }, this.scene);
                backWall.position.z = 3;
                backWall.position.y = wallHeight / 2;
                backWall.material = wallMaterial;
                this.meshes.push(backWall);

                // Left wall
                const leftWall = BABYLON.MeshBuilder.CreatePlane('leftWall', {
                    width: 6,
                    height: wallHeight
                }, this.scene);
                leftWall.position.x = -2.5;
                leftWall.position.y = wallHeight / 2;
                leftWall.rotation.y = Math.PI / 2;
                leftWall.material = wallMaterial;
                this.meshes.push(leftWall);

                // Right wall
                const rightWall = BABYLON.MeshBuilder.CreatePlane('rightWall', {
                    width: 6,
                    height: wallHeight
                }, this.scene);
                rightWall.position.x = 2.5;
                rightWall.position.y = wallHeight / 2;
                rightWall.rotation.y = -Math.PI / 2;
                rightWall.material = wallMaterial;
                this.meshes.push(rightWall);

                // Baseboards with wood material
                this.createBaseboard(-2.5, 3, 0, 6, Math.PI / 2); // Left
                this.createBaseboard(2.5, 3, 0, 6, -Math.PI / 2); // Right
                this.createBaseboard(0, 3, 3, 5, 0); // Back
            }

            /**
             * Create detailed baseboard
             */
            createBaseboard(x, z, y, width, rotationY) {
                const baseboard = BABYLON.MeshBuilder.CreateBox('baseboard', {
                    width: width,
                    height: 0.12,
                    depth: 0.04
                }, this.scene);
                baseboard.position.set(x, 0.06, z);
                baseboard.rotation.y = rotationY;
                baseboard.material = this.materials.wood;
                this.meshes.push(baseboard);
            }

            /**
             * Create window with detailed blinds
             */
            createWindow() {
                const windowX = -1.5;
                const windowY = 1.8;
                const windowZ = 2.95;

                // Window frame - wood
                const frame = BABYLON.MeshBuilder.CreateBox('windowFrame', {
                    width: 1.4,
                    height: 1.6,
                    depth: 0.08
                }, this.scene);
                frame.position.set(windowX, windowY, windowZ);
                frame.material = this.materials.darkWood;
                this.meshes.push(frame);

                // Glass pane
                const glass = BABYLON.MeshBuilder.CreatePlane('windowGlass', {
                    width: 1.3,
                    height: 1.5
                }, this.scene);
                glass.position.set(windowX, windowY, windowZ + 0.05);
                glass.material = this.materials.glass;
                this.meshes.push(glass);

                // Venetian blinds - more detailed
                const blindsMaterial = new BABYLON.StandardMaterial('blindsMaterial', this.scene);
                blindsMaterial.diffuseColor = new BABYLON.Color3(0.82, 0.78, 0.7);
                blindsMaterial.specularColor = new BABYLON.Color3(0.35, 0.35, 0.35);

                const numSlats = 18;
                const slatSpacing = 1.5 / numSlats;

                for (let i = 0; i < numSlats; i++) {
                    const slat = BABYLON.MeshBuilder.CreateBox(`blind${i}`, {
                        width: 1.2,
                        height: 0.035,
                        depth: 0.008
                    }, this.scene);

                    const yPos = windowY - 0.75 + (i * slatSpacing);
                    slat.position.set(windowX, yPos, windowZ + 0.08);
                    slat.rotation.x = Math.PI / 14; // Slight angle
                    slat.material = blindsMaterial;
                    this.meshes.push(slat);
                }

                // Blind pull cord
                const cord = BABYLON.MeshBuilder.CreateCylinder('blindCord', {
                    height: 1.8,
                    diameter: 0.012
                }, this.scene);
                cord.position.set(windowX + 0.55, windowY - 0.1, windowZ + 0.1);
                cord.material = blindsMaterial;
                this.meshes.push(cord);
            }

            /**
             * Create detailed office door
             */
            createDoor() {
                const doorX = 2;
                const doorY = 1.1;
                const doorZ = 2.95;

                // Door frame
                const doorFrame = BABYLON.MeshBuilder.CreateBox('doorFrame', {
                    width: 0.95,
                    height: 2.2,
                    depth: 0.12
                }, this.scene);
                doorFrame.position.set(doorX, doorY, doorZ);
                doorFrame.material = this.materials.darkWood;
                this.meshes.push(doorFrame);

                // Door panel
                const door = BABYLON.MeshBuilder.CreateBox('door', {
                    width: 0.88,
                    height: 2.1,
                    depth: 0.06
                }, this.scene);
                door.position.set(doorX, doorY, doorZ + 0.04);
                door.material = this.materials.wood;
                this.meshes.push(door);

                // Door panels (decorative insets)
                for (let i = 0; i < 2; i++) {
                    const panel = BABYLON.MeshBuilder.CreateBox('doorPanel', {
                        width: 0.7,
                        height: 0.85,
                        depth: 0.02
                    }, this.scene);
                    panel.position.set(doorX, doorY + 0.45 - (i * 1.0), doorZ + 0.07);

                    const panelMat = new BABYLON.StandardMaterial('doorPanelMat', this.scene);
                    panelMat.diffuseColor = new BABYLON.Color3(0.35, 0.23, 0.12);
                    panelMat.specularColor = new BABYLON.Color3(0.2, 0.15, 0.08);
                    panel.material = panelMat;
                    this.meshes.push(panel);
                }

                // Brass door knob
                const knob = BABYLON.MeshBuilder.CreateSphere('doorKnob', {
                    diameter: 0.065
                }, this.scene);
                knob.position.set(doorX - 0.35, doorY, doorZ + 0.08);
                knob.material = this.materials.brass;
                this.meshes.push(knob);

                // Frosted glass window in door
                const doorWindow = BABYLON.MeshBuilder.CreateBox('doorWindow', {
                    width: 0.32,
                    height: 0.5,
                    depth: 0.015
                }, this.scene);
                doorWindow.position.set(doorX + 0.05, doorY + 0.75, doorZ + 0.075);
                doorWindow.material = this.materials.glass;
                this.meshes.push(doorWindow);
            }

            /**

                // Wood frame around board
                const frameWidth = 0.06;
                const frameParts = [
                    { w: 1.3, h: frameWidth, x: 0, y: 0.48 }, // Top
                    { w: 1.3, h: frameWidth, x: 0, y: -0.48 }, // Bottom
                    { w: frameWidth, h: 0.9, x: -0.65, y: 0 }, // Left

                frameParts.forEach(part => {

                    framePiece.material = this.materials.darkWood;
                    this.meshes.push(framePiece);
                });

                // Add photos/documents pinned to board
                const photoPositions = [
                    { x: -0.3, y: 0.2 }, { x: 0.25, y: 0.25 },
                    { x: -0.35, y: -0.2 }, { x: 0.15, y: -0.25 },
                    { x: 0, y: 0.05 }
                ];

                photoPositions.forEach((pos, i) => {
                    // Photo/document
                    const photo = BABYLON.MeshBuilder.CreatePlane('photo', {
                        width: 0.22,
                        height: 0.18
                    }, this.scene);
                    photo.position.set(boardX + pos.x, boardY + pos.y, boardZ + 0.025);
                    photo.rotation.z = (Math.random() - 0.5) * 0.2;

                    const photoMat = new BABYLON.StandardMaterial('photoMat', this.scene);
                    photoMat.diffuseColor = new BABYLON.Color3(0.85, 0.82, 0.78);
                    photoMat.emissiveColor = new BABYLON.Color3(0.05, 0.05, 0.05);
                    photo.material = photoMat;
                    this.meshes.push(photo);

                    // Push pin
                    const pin = BABYLON.MeshBuilder.CreateCylinder('pushPin', {
                        height: 0.02,
                        diameter: 0.015
                    }, this.scene);
                    pin.position.set(boardX + pos.x, boardY + pos.y + 0.08, boardZ + 0.03);

                    const pinMat = new BABYLON.StandardMaterial('pinMat', this.scene);
                    const pinColors = [
                        new BABYLON.Color3(0.8, 0.15, 0.15), // Red
                        new BABYLON.Color3(0.15, 0.15, 0.8), // Blue
                        new BABYLON.Color3(0.9, 0.85, 0.2), // Yellow
                    ];
                    pinMat.diffuseColor = pinColors[i % pinColors.length];
                    pin.material = pinMat;
                    this.meshes.push(pin);
                });

                // Red string connecting photos (detective connections)
                const stringMat = new BABYLON.StandardMaterial('stringMat', this.scene);
                stringMat.diffuseColor = new BABYLON.Color3(0.85, 0.15, 0.15);
                stringMat.emissiveColor = new BABYLON.Color3(0.2, 0.03, 0.03);

                const connections = [
                    [photoPositions[0], photoPositions[1]],
                    [photoPositions[1], photoPositions[4]],
                    [photoPositions[4], photoPositions[2]],
                ];

                connections.forEach(([start, end]) => {
                    const distance = Math.sqrt(Math.pow(end.x - start.x, 2) + Math.pow(end.y - start.y, 2));
                    const string = BABYLON.MeshBuilder.CreateCylinder('string', {
                        height: distance,
                        diameter: 0.004
                    }, this.scene);

                    const midX = (start.x + end.x) / 2;
                    const midY = (start.y + end.y) / 2;
                    string.position.set(boardX + midX, boardY + midY, boardZ + 0.022);

                    const angle = Math.atan2(end.y - start.y, end.x - start.x);
                    string.rotation.z = angle - Math.PI / 2;

                    string.material = stringMat;
                    this.meshes.push(string);
                });
            }

        // ============================================
        // PhoneObject Class (Smartphone)
        // ============================================
        class PhoneObject {
            constructor(scene, audioManager, position = new BABYLON.Vector3(0, 0.85, 0)) {
                this.scene = scene;
                this.audioManager = audioManager;
                this.position = position;
                this.mesh = null;
                this.isRinging = false;
                this.isPickedUp = false;
                this.shakeAnimation = null;
                this.originalPosition = position.clone();
                this.onPickUpCallback = null;

                this.initialize();
            }

            initialize() {
                console.log('Creating phone object...');

                const phoneBody = BABYLON.MeshBuilder.CreateBox('phoneBody', {
                    width: 0.15,
                    height: 0.05,
                    depth: 0.25
                }, this.scene);

                const handset = BABYLON.MeshBuilder.CreateCylinder('handset', {
                    height: 0.2,
                    diameter: 0.04,
                    tessellation: 16
                }, this.scene);
                handset.rotation.x = Math.PI / 2;
                handset.rotation.z = Math.PI / 6;
                handset.position.y = 0.04;
                handset.position.x = -0.02;

                const earpiece = BABYLON.MeshBuilder.CreateSphere('earpiece', {
                    diameter: 0.05,
                    segments: 16
                }, this.scene);
                earpiece.position.y = 0.04;
                earpiece.position.x = 0.06;
                earpiece.position.z = 0.08;

                const mouthpiece = BABYLON.MeshBuilder.CreateSphere('mouthpiece', {
                    diameter: 0.05,
                    segments: 16
                }, this.scene);
                mouthpiece.position.y = 0.04;
                mouthpiece.position.x = -0.1;
                mouthpiece.position.z = -0.08;

                const buttons = [];
                const buttonPositions = [
                    [-0.04, 0.04], [0, 0.04], [0.04, 0.04],
                    [-0.04, 0], [0, 0], [0.04, 0],
                    [-0.04, -0.04], [0, -0.04], [0.04, -0.04],
                    [-0.04, -0.08], [0, -0.08], [0.04, -0.08]
                ];

                buttonPositions.forEach((pos, i) => {
                    const button = BABYLON.MeshBuilder.CreateCylinder(`button${i}`, {
                        height: 0.01,
                        diameter: 0.02,
                        tessellation: 16
                    }, this.scene);
                    button.position.x = pos[0];
                    button.position.y = 0.031;
                    button.position.z = pos[1];
                    buttons.push(button);
                });

                const cordPath = [];
                for (let i = 0; i < 20; i++) {
                    const angle = i * Math.PI / 4;
                    cordPath.push(new BABYLON.Vector3(
                        -0.075 + Math.cos(angle) * 0.01,
                        0.025 - i * 0.003,
                        -0.12 + i * 0.005
                    ));
                }
                const cord = BABYLON.MeshBuilder.CreateTube('cord', {
                    path: cordPath,
                    radius: 0.002,
                    tessellation: 8,
                    cap: BABYLON.Mesh.CAP_ALL
                }, this.scene);

                this.mesh = BABYLON.Mesh.CreateBox('phone', 0.01, this.scene);
                this.mesh.isVisible = false;

                phoneBody.parent = this.mesh;
                handset.parent = this.mesh;
                earpiece.parent = this.mesh;
                mouthpiece.parent = this.mesh;
                cord.parent = this.mesh;
                buttons.forEach(button => button.parent = this.mesh);

                const phoneMaterial = new BABYLON.StandardMaterial('phoneMaterial', this.scene);
                phoneMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                phoneMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                phoneMaterial.specularPower = 64;

                const handsetMaterial = new BABYLON.StandardMaterial('handsetMaterial', this.scene);
                handsetMaterial.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.15);

                const buttonMaterial = new BABYLON.StandardMaterial('buttonMaterial', this.scene);
                buttonMaterial.diffuseColor = new BABYLON.Color3(0.8, 0.8, 0.8);
                buttonMaterial.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                const cordMaterial = new BABYLON.StandardMaterial('cordMaterial', this.scene);
                cordMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                phoneBody.material = phoneMaterial;
                handset.material = handsetMaterial;
                earpiece.material = handsetMaterial;
                mouthpiece.material = handsetMaterial;
                cord.material = cordMaterial;
                buttons.forEach(button => button.material = buttonMaterial);

                this.mesh.position = this.position;

                this.setupInteraction();

                console.log('Phone object created successfully');
            }

            setupInteraction() {
                this.mesh.getChildMeshes().forEach(mesh => {
                    mesh.isPickable = true;
                });

                this.mesh.actionManager = new BABYLON.ActionManager(this.scene);

                this.mesh.actionManager.registerAction(
                    new BABYLON.ExecuteCodeAction(
                        BABYLON.ActionManager.OnPickTrigger,
                        () => this.handlePickup()
                    )
                );

                this.mesh.getChildMeshes().forEach(childMesh => {
                    childMesh.actionManager = new BABYLON.ActionManager(this.scene);
                    childMesh.actionManager.registerAction(
                        new BABYLON.ExecuteCodeAction(
                            BABYLON.ActionManager.OnPickTrigger,
                            () => this.handlePickup()
                        )
                    );

                    childMesh.actionManager.registerAction(
                        new BABYLON.ExecuteCodeAction(
                            BABYLON.ActionManager.OnPointerOverTrigger,
                            () => {
                                if (this.isRinging) {
                                    this.scene.getEngine().getRenderingCanvas().style.cursor = 'pointer';
                                }
                            }
                        )
                    );

                    childMesh.actionManager.registerAction(
                        new BABYLON.ExecuteCodeAction(
                            BABYLON.ActionManager.OnPointerOutTrigger,
                            () => {
                                this.scene.getEngine().getRenderingCanvas().style.cursor = 'default';
                            }
                        )
                    );
                });
            }

            handlePickup() {
                if (this.isRinging) {
                    console.log('Phone answered!');
                    this.stopRinging();
                    this.isPickedUp = true;

                    if (this.onPickUpCallback) {
                        this.onPickUpCallback();
                    }
                }
            }

            startRinging() {
                if (this.isRinging) return;

                console.log('Phone is ringing...');
                this.isRinging = true;
                this.isPickedUp = false;

                this.audioManager.playPhoneRing();
                this.startShakeAnimation();
                this.updatePhoneStatus('Ringing...', true);
            }

            stopRinging() {
                if (!this.isRinging) return;

                console.log('Phone stopped ringing');
                this.isRinging = false;

                this.audioManager.stopPhoneRing();
                this.stopShakeAnimation();
                this.updatePhoneStatus('Answered', false);

                this.mesh.position = this.originalPosition.clone();
                this.mesh.rotation = BABYLON.Vector3.Zero();
            }

            startShakeAnimation() {
                const shakeStrength = 0.008;
                const shakeSpeed = 30;
                const rotationStrength = 0.05;

                let elapsed = 0;
                const startPosition = this.mesh.position.clone();
                const startRotation = this.mesh.rotation.clone();

                this.shakeAnimation = this.scene.onBeforeRenderObservable.add(() => {
                    if (!this.isRinging) return;

                    elapsed += this.scene.getEngine().getDeltaTime() / 1000;

                    const shakeX = Math.sin(elapsed * shakeSpeed) * shakeStrength;
                    const shakeZ = Math.cos(elapsed * shakeSpeed * 1.3) * shakeStrength;
                    const bounceY = Math.abs(Math.sin(elapsed * shakeSpeed * 0.5)) * shakeStrength * 0.5;
                    const rotationY = Math.sin(elapsed * shakeSpeed * 0.8) * rotationStrength;
                    const rotationZ = Math.cos(elapsed * shakeSpeed * 1.1) * rotationStrength * 0.5;

                    this.mesh.position.x = startPosition.x + shakeX;
                    this.mesh.position.y = startPosition.y + bounceY;
                    this.mesh.position.z = startPosition.z + shakeZ;

                    this.mesh.rotation.y = startRotation.y + rotationY;
                    this.mesh.rotation.z = startRotation.z + rotationZ;
                });
            }

            stopShakeAnimation() {
                if (this.shakeAnimation) {
                    this.scene.onBeforeRenderObservable.remove(this.shakeAnimation);
                    this.shakeAnimation = null;
                }
            }

            updatePhoneStatus(status, isRinging) {
                const statusElement = document.getElementById('status-text');
                const statusContainer = document.getElementById('phone-status');

                if (statusElement) {
                    statusElement.textContent = status;
                }

                if (statusContainer) {
                    if (isRinging) {
                        statusContainer.classList.add('status-ringing');
                    } else {
                        statusContainer.classList.remove('status-ringing');
                    }
                }
            }

            setOnPickUpCallback(callback) {
                this.onPickUpCallback = callback;
            }

            dispose() {
                this.stopRinging();
                if (this.mesh) {
                    this.mesh.dispose();
                }
            }
        }

        // ============================================
        // GameManager Class
        // ============================================
        class GameManager {
            constructor(canvas) {
                this.canvas = canvas;
                this.engine = null;
                this.scene = null;
                this.camera = null;
                this.audioManager = null;
                this.phoneObject = null;
                this.tableObject = null;
                this.officeEnvironment = null;
                this.initialCameraRadius = 2.5;
                this.initialCameraAlpha = Math.PI / 2;
                this.initialCameraBeta = Math.PI / 3;
            }

            async initialize() {
                console.log('Initializing game...');

                try {
                    this.updateLoadingStatus('Creating 3D engine...');

                    this.engine = new BABYLON.Engine(this.canvas, true, {
                        preserveDrawingBuffer: true,
                        stencil: true
                    });

                    this.scene = new BABYLON.Scene(this.engine);
                    this.scene.clearColor = new BABYLON.Color4(0.85, 0.88, 0.92, 1);

                    this.updateLoadingStatus('Setting up camera...');

                    this.camera = new BABYLON.ArcRotateCamera(
                        'camera',
                        Math.PI / 2,
                        Math.PI / 3,
                        2.5,
                        new BABYLON.Vector3(0, 0.8, 0),
                        this.scene
                    );

                    this.camera.attachControl(this.canvas, true);
                    this.camera.lowerRadiusLimit = 1.5;
                    this.camera.upperRadiusLimit = 4;
                    this.camera.lowerBetaLimit = 0.1;
                    this.camera.upperBetaLimit = Math.PI / 2;

                    this.updateLoadingStatus('Creating lights...');

                    this.setupLighting();

                    this.updateLoadingStatus('Initializing audio system...');

                    this.audioManager = new AudioManager(this.scene);
                    await this.audioManager.initialize();

                    this.updateLoadingStatus('Creating table...');

                    this.tableObject = new TableObject(this.scene, new BABYLON.Vector3(0, 0, 0));

                    this.updateLoadingStatus('Creating phone...');

                    const tableTop = this.tableObject.getTopSurfaceY();
                    this.phoneObject = new PhoneObject(
                        this.scene,
                        this.audioManager,
                        new BABYLON.Vector3(0, tableTop, 0)
                    );

                    this.phoneObject.setOnPickUpCallback(() => {
                        this.onPhonePickedUp();
                    });

                    this.updateLoadingStatus('Setting up environment...');

                    // Create complete detective office environment
                    this.officeEnvironment = new OfficeEnvironment(this.scene);

                    this.updateLoadingStatus('Ready!');

                    // Hide loading, show start button
                    setTimeout(() => {
                        const loadingElement = document.getElementById('loading');
                        const startButton = document.getElementById('start-button');
                        if (loadingElement) {
                            loadingElement.style.display = 'none';
                        }
                        if (startButton) {
                            startButton.style.display = 'block';
                        }
                    }, 500);

                    this.engine.runRenderLoop(() => {
                        this.scene.render();
                    });

                    window.addEventListener('resize', () => {
                        this.engine.resize();
                    });

                    console.log('Game initialized successfully!');

                } catch (error) {
                    console.error('Initialization error:', error);
                    this.updateLoadingStatus('Error: ' + error.message);
                    throw error;
                }
            }

            startGame() {
                // Hide start button
                const startButton = document.getElementById('start-button');
                if (startButton) {
                    startButton.style.display = 'none';
                }

                // Start background music
                this.audioManager.playBackgroundMusic();

                // Start phone ringing after delay
                setTimeout(() => {
                    this.phoneObject.startRinging();
                }, 2000);
            }

            setupLighting() {
                const ambientLight = new BABYLON.HemisphericLight(
                    'ambientLight',
                    new BABYLON.Vector3(0, 1, 0),
                    this.scene
                );
                ambientLight.intensity = 0.9;
                ambientLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);
                ambientLight.specular = new BABYLON.Color3(0.5, 0.5, 0.5);

                const mainLight = new BABYLON.DirectionalLight(
                    'mainLight',
                    new BABYLON.Vector3(-1, -2, -1),
                    this.scene
                );
                mainLight.position = new BABYLON.Vector3(2, 3, 2);
                mainLight.intensity = 1.2;
                mainLight.diffuse = new BABYLON.Color3(1, 0.98, 0.92);

                const rimLight = new BABYLON.PointLight(
                    'rimLight',
                    new BABYLON.Vector3(-1, 2, 1),
                    this.scene
                );
                rimLight.intensity = 0.3;
                rimLight.diffuse = new BABYLON.Color3(0.8, 0.9, 1);

                const deskLamp = new BABYLON.SpotLight(
                    'deskLamp',
                    new BABYLON.Vector3(0.5, 2, -0.3),
                    new BABYLON.Vector3(0, -1, 0.2),
                    Math.PI / 3,
                    2,
                    this.scene
                );
                deskLamp.intensity = 0.5;
                deskLamp.diffuse = new BABYLON.Color3(1, 0.9, 0.7);
            }

            updateLoadingStatus(status) {
                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    loadingElement.innerHTML = `<p>${status}</p>`;
                }
                console.log('Status:', status);
            }

            onPhonePickedUp() {
                console.log('Phone answered - triggering story event');

                setTimeout(() => {
                    this.phoneObject.updatePhoneStatus('Call ended', false);
                }, 3000);
            }

            dispose() {
                if (this.phoneObject) this.phoneObject.dispose();
                if (this.tableObject) this.tableObject.dispose();
                if (this.officeEnvironment) this.officeEnvironment.dispose();
                if (this.audioManager) this.audioManager.dispose();
                if (this.scene) this.scene.dispose();
                if (this.engine) this.engine.dispose();
            }
        }

        // ============================================
        // Main Entry Point
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('=== Detective Game Starting ===');

            const canvas = document.getElementById('renderCanvas');
            const startButton = document.getElementById('start-button');

            if (!canvas) {
                console.error('Canvas element not found!');
                return;
            }

            const gameManager = new GameManager(canvas);

            gameManager.initialize().catch(error => {
                console.error('Failed to initialize game:', error);

                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    loadingElement.innerHTML = `
                        <p style="color: #ff4444;">Error loading game:</p>
                        <p style="font-size: 14px;">${error.message}</p>
                        <p style="font-size: 12px; margin-top: 10px;">Check console (F12) for details.</p>
                    `;
                }
            });

            // Start button click handler
            startButton.addEventListener('click', () => {
                gameManager.startGame();
            });

            window.addEventListener('beforeunload', () => {
                console.log('Cleaning up game resources...');
                gameManager.dispose();
            });
        });

        console.log('Detective Game module loaded');
    </script>
</body>
