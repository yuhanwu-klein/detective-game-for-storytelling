<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test - Detective Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
            font-family: monospace;
        }
        #renderCanvas {
            width: 100%;
            height: 600px;
            display: block;
            background: #333;
        }
        #debug {
            margin-bottom: 20px;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #4CAF50;
        }
    </style>
</head>
<body>
    <div id="debug">
        <h2>Debug Log:</h2>
        <div id="log"></div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <!-- Try Babylon.js from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <script>
        const log = (msg) => {
            console.log(msg);
            document.getElementById('log').innerHTML += `<p>${msg}</p>`;
        };

        log('Starting debug...');

        window.addEventListener('DOMContentLoaded', () => {
            log('DOM loaded');

            try {
                // Check if BABYLON is loaded
                if (typeof BABYLON === 'undefined') {
                    log('ERROR: Babylon.js not loaded from CDN!');
                    return;
                }
                log('✓ Babylon.js loaded successfully');

                const canvas = document.getElementById('renderCanvas');
                log('✓ Canvas found');

                const engine = new BABYLON.Engine(canvas, true);
                log('✓ Engine created');

                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color4(0.85, 0.88, 0.92, 1);
                log('✓ Scene created with bright background');

                const camera = new BABYLON.ArcRotateCamera('camera', 0, 0, 10, BABYLON.Vector3.Zero(), scene);
                camera.attachControl(canvas, true);
                log('✓ Camera created');

                const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
                light.intensity = 1;
                log('✓ Light created');

                const sphere = BABYLON.MeshBuilder.CreateSphere('sphere', {diameter: 2}, scene);
                log('✓ Test sphere created');

                engine.runRenderLoop(() => {
                    scene.render();
                });
                log('✓ Render loop started');

                window.addEventListener('resize', () => {
                    engine.resize();
                });

                log('SUCCESS: All systems working! You should see a sphere.');

            } catch (error) {
                log('ERROR: ' + error.message);
                log('Stack: ' + error.stack);
            }
        });
    </script>
</body>
</html>
