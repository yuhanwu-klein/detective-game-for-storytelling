<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective Game - Ringing Telephone</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useRef, useState } = React;

        function RingingTelephone() {
            const mountRef = useRef(null);
            const [isRinging, setIsRinging] = useState(false);
            const [showNotebook, setShowNotebook] = useState(false);
            const [noteText, setNoteText] = useState('location: outside the city\nevent: murder\n\n');
            const [hasStarted, setHasStarted] = useState(false);
            const [currentScene, setCurrentScene] = useState('office'); // 'office' or 'house'
            const [selectedTool, setSelectedTool] = useState(null); // Tool system
            const [showToolbox, setShowToolbox] = useState(false);
            const [showEvidenceBoard, setShowEvidenceBoard] = useState(false);
            const [collectedEvidence, setCollectedEvidence] = useState([]);
            const [zoomTarget, setZoomTarget] = useState(null);
            const [flashlightOn, setFlashlightOn] = useState(false);
            const [discoveredClues, setDiscoveredClues] = useState([]);
            const [showCluePopup, setShowCluePopup] = useState(null);
            const [showCaseSummary, setShowCaseSummary] = useState(false);
            const [selectedSuspect, setSelectedSuspect] = useState(null);
            const [showResult, setShowResult] = useState(false);
            const [showToolboxHint, setShowToolboxHint] = useState(true);
            const sceneRef = useRef(null);
            const audioRef = useRef(null);
            const voiceAudioRef = useRef(null);

            // Suspect profiles
            const suspects = [
                { id: 1, name: 'Man 1', age: 34, shoe: 'Size 11 Nike Air Max', details: 'Former business partner. Had threatening argument yesterday.', isGuilty: true },
                { id: 2, name: 'Woman 1', age: 28, shoe: 'Size 7 Adidas', details: 'Ex-girlfriend. Claims she was at home during incident.', isGuilty: false },
                { id: 3, name: 'Man 2', age: 45, shoe: 'Size 10 Reebok', details: 'Neighbor. Heard arguing but saw nothing suspicious.', isGuilty: false },
                { id: 4, name: 'Man 3', age: 52, shoe: 'Size 12 Converse', details: 'Victim\'s landlord. Had financial disputes recently.', isGuilty: false }
            ];

            // Define interactive hotspots with clues (adjusted positions for better alignment)
            const hotspots = [
                { id: 'blood1', x: 60, y: 64, label: 'Blood Pool', tool: 'magnifier', clue: '🔬 Type O+ blood detected. Fresh, approximately 2-3 hours old.' },
                { id: 'footprint', x: 72, y: 60, label: 'Footprint', tool: 'magnifier', clue: '👟 Size 11 shoe print. Brand: Nike Air Max. Traces of victim\'s blood.' },
                { id: 'knife', x: 48, y: 62, label: 'Weapon', tool: 'camera', clue: '📸 Murder weapon photographed. Kitchen knife with 6-inch blade.' },
                { id: 'phone', x: 32, y: 62, label: 'Phone', tool: 'gloves', clue: '📱 Victim\'s phone collected. Last call: 11:47 PM to unknown number.' },
                { id: 'bodyoutline', x: 56, y: 58, label: 'Body Outline', tool: 'camera', clue: '📸 Victim position documented. Arms outstretched, suggesting defensive posture.' },
                { id: 'papers', x: 40, y: 60, label: 'Documents', tool: 'gloves', clue: '📄 Scattered documents collected. Contains threatening letter dated yesterday.' },
                { id: 'window', x: 15, y: 52, label: 'Window', tool: 'flashlight', clue: '🔦 Window unlocked! Possible entry/exit point for suspect.' },
                { id: 'wallblood', x: 52, y: 40, label: 'Blood Splatter', tool: 'magnifier', clue: '🔬 Arterial spray pattern. Attack occurred from behind victim.' },
                { id: 'casing', x: 46, y: 58, label: 'Bullet Casing', tool: 'gloves', clue: '🔫 9mm bullet casing. Fired from close range (2-3 feet).' },
                { id: 'handprint', x: 10, y: 52, label: 'Handprint', tool: 'flashlight', clue: '🔦 Bloody handprint revealed! Medium size, likely male suspect.' }
            ];

            useEffect(() => {
                if (!mountRef.current) return;

                // Scene setup
                const scene = new THREE.Scene();

                if (currentScene === 'office') {
                    scene.background = new THREE.Color(0x4a5568);
                    scene.fog = new THREE.Fog(0x4a5568, 15, 40);
                } else {
                    // House scene - darker, more ominous
                    scene.background = new THREE.Color(0x2a2a2a);
                    scene.fog = new THREE.Fog(0x2a2a2a, 10, 30);
                }

                // Camera
                const camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                camera.position.set(0, 3, 8);
                camera.lookAt(0, 0, 0);

                // Renderer
                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                mountRef.current.appendChild(renderer.domElement);

                // Scene-specific content
                let phoneGroup = null; // Only for office scene
                let screen = null; // Only for office scene

                if (currentScene === 'office') {
                    // Lights - Office lighting
                    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                    scene.add(ambientLight);

                    const spotLight = new THREE.SpotLight(0xffffee, 1.2);
                    spotLight.position.set(3, 7, 5);
                    spotLight.castShadow = true;
                    spotLight.shadow.mapSize.width = 2048;
                    spotLight.shadow.mapSize.height = 2048;
                    scene.add(spotLight);

                    const fillLight = new THREE.PointLight(0xaaaaff, 0.3);
                    fillLight.position.set(-5, 5, -5);
                    scene.add(fillLight);

                // Floor
                const floorGeometry = new THREE.PlaneGeometry(30, 30);
                const floorMaterial = new THREE.MeshStandardMaterial({
                    color: 0x3a3a3a,
                    roughness: 0.8,
                    metalness: 0.1
                });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -3;
                floor.receiveShadow = true;
                scene.add(floor);

                // Back wall
                const backWallGeometry = new THREE.PlaneGeometry(30, 15);
                const wallMaterial = new THREE.MeshStandardMaterial({
                    color: 0x6b7280,
                    roughness: 0.9
                });
                const backWall = new THREE.Mesh(backWallGeometry, wallMaterial);
                backWall.position.set(0, 4.5, -10);
                backWall.receiveShadow = true;
                scene.add(backWall);

                // Table
                const tableGeometry = new THREE.BoxGeometry(8, 0.3, 6);
                const tableMaterial = new THREE.MeshStandardMaterial({
                    color: 0x8b4513,
                    roughness: 0.7,
                    metalness: 0.1
                });
                const table = new THREE.Mesh(tableGeometry, tableMaterial);
                table.position.y = -1;
                table.receiveShadow = true;
                table.castShadow = true;
                scene.add(table);

                // Phone Group
                phoneGroup = new THREE.Group();
                phoneGroup.position.set(0, -0.7, 0);
                phoneGroup.scale.set(0.6, 0.6, 0.6);
                scene.add(phoneGroup);

                // SMARTPHONE BODY
                const phoneBodyGeometry = new THREE.BoxGeometry(1.2, 0.15, 2.4);
                const phoneBodyMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    roughness: 0.2,
                    metalness: 0.8
                });
                const phoneBody = new THREE.Mesh(phoneBodyGeometry, phoneBodyMaterial);
                phoneBody.castShadow = true;
                phoneBody.receiveShadow = true;
                phoneGroup.add(phoneBody);

                // Screen
                const screenGeometry = new THREE.BoxGeometry(1.1, 0.02, 2.3);
                const screenMaterial = new THREE.MeshStandardMaterial({
                    color: 0x0a0a0a,
                    roughness: 0.1,
                    metalness: 0.9,
                    emissive: 0x1a1a3a,
                    emissiveIntensity: 0.3
                });
                screen = new THREE.Mesh(screenGeometry, screenMaterial);
                screen.position.set(0, 0.085, 0);
                phoneGroup.add(screen);

                // Notch
                const notchGeometry = new THREE.BoxGeometry(0.3, 0.03, 0.08);
                const notchMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
                const notch = new THREE.Mesh(notchGeometry, notchMaterial);
                notch.position.set(0, 0.09, -1.05);
                phoneGroup.add(notch);

                // Triple cameras on back
                const cameraPositions = [
                    [-0.35, -0.14, -1.0],
                    [-0.25, -0.14, -0.85],
                    [-0.45, -0.14, -0.85]
                ];

                cameraPositions.forEach((pos) => {
                    const ringGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.02, 32);
                    const ringMaterial = new THREE.MeshStandardMaterial({
                        color: 0x444444,
                        roughness: 0.2,
                        metalness: 0.9
                    });
                    const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                    ring.rotation.x = Math.PI / 2;
                    ring.position.set(...pos);
                    phoneGroup.add(ring);
                });

                // Store screen reference
                phoneGroup.userData.screen = screen;

                // Office Chair
                const chairBaseGeometry = new THREE.CylinderGeometry(0.7, 0.7, 0.12, 5);
                const chairMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    roughness: 0.6,
                    metalness: 0.4
                });
                const chairBase = new THREE.Mesh(chairBaseGeometry, chairMaterial);
                chairBase.position.set(-1, -2.5, -4);
                chairBase.castShadow = true;
                scene.add(chairBase);

                const poleGeometry = new THREE.CylinderGeometry(0.1, 0.1, 1.3, 16);
                const pole = new THREE.Mesh(poleGeometry, chairMaterial);
                pole.position.set(-1, -1.9, -4);
                pole.castShadow = true;
                scene.add(pole);

                const seatGeometry = new THREE.CylinderGeometry(0.75, 0.7, 0.25, 32);
                const seatMaterial = new THREE.MeshStandardMaterial({
                    color: 0x2c3e50,
                    roughness: 0.7
                });
                const seat = new THREE.Mesh(seatGeometry, seatMaterial);
                seat.position.set(-1, -1.2, -4);
                seat.castShadow = true;
                scene.add(seat);

                const backrestGeometry = new THREE.BoxGeometry(0.9, 1.2, 0.15);
                const backrest = new THREE.Mesh(backrestGeometry, seatMaterial);
                backrest.position.set(-1, -0.4, -4.9);
                backrest.rotation.x = -0.3;
                backrest.castShadow = true;
                scene.add(backrest);

                // Computer Monitor
                const monitorScreenGeometry = new THREE.BoxGeometry(2, 1.2, 0.1);
                const monitorScreenMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    roughness: 0.3,
                    metalness: 0.7
                });
                const monitorScreen = new THREE.Mesh(monitorScreenGeometry, monitorScreenMaterial);
                monitorScreen.position.set(-2.5, 0, -1.5);
                monitorScreen.rotation.y = Math.PI;
                monitorScreen.castShadow = true;
                scene.add(monitorScreen);

                // Coffee cup
                const cupGeometry = new THREE.CylinderGeometry(0.15, 0.12, 0.3, 16);
                const cupMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
                const coffeeCup = new THREE.Mesh(cupGeometry, cupMaterial);
                coffeeCup.position.set(2.5, -0.7, 0.5);
                coffeeCup.castShadow = true;
                scene.add(coffeeCup);

                // Books on table
                const bookColors = [0x8b0000, 0x006400, 0x00008b, 0x8b4513, 0x4b0082];
                for (let i = 0; i < 5; i++) {
                    const bookGeometry = new THREE.BoxGeometry(0.6, 0.8, 0.05);
                    const bookMaterial = new THREE.MeshStandardMaterial({
                        color: bookColors[i],
                        roughness: 0.8
                    });
                    const book = new THREE.Mesh(bookGeometry, bookMaterial);
                    book.position.set(-3, -0.55 + i * 0.06, -1.5);
                    book.rotation.y = 0.1 + i * 0.05;
                    book.castShadow = true;
                    scene.add(book);
                }

                // Stack of books lying flat
                const flatBookColors = [0x2f4f4f, 0x556b2f, 0x8b4513];
                for (let i = 0; i < 3; i++) {
                    const flatBookGeometry = new THREE.BoxGeometry(0.7, 0.05, 0.9);
                    const flatBookMaterial = new THREE.MeshStandardMaterial({
                        color: flatBookColors[i],
                        roughness: 0.8
                    });
                    const flatBook = new THREE.Mesh(flatBookGeometry, flatBookMaterial);
                    flatBook.position.set(1.5, -0.82 + i * 0.06, -1.8);
                    flatBook.rotation.y = -0.2;
                    flatBook.castShadow = true;
                    scene.add(flatBook);
                }

                // Pen holder on table
                const penHolderGeometry = new THREE.CylinderGeometry(0.12, 0.1, 0.25, 16);
                const penHolderMaterial = new THREE.MeshStandardMaterial({
                    color: 0x2c2c2c,
                    roughness: 0.7
                });
                const penHolder = new THREE.Mesh(penHolderGeometry, penHolderMaterial);
                penHolder.position.set(1.8, -0.72, -1.2);
                penHolder.castShadow = true;
                scene.add(penHolder);

                // Pens in holder - neatly organized
                const penColors = [0x0000ff, 0xff0000, 0x000000, 0x00ff00, 0xffa500];

                penColors.forEach((color, index) => {
                    const penGeometry = new THREE.CylinderGeometry(0.015, 0.015, 0.5, 8);
                    const penMaterial = new THREE.MeshStandardMaterial({
                        color: color,
                        metalness: 0.5,
                        roughness: 0.3
                    });
                    const pen = new THREE.Mesh(penGeometry, penMaterial);

                    // Arrange pens in a circle inside the holder
                    const angle = (index * Math.PI * 2) / penColors.length;
                    const radius = 0.05;
                    pen.position.set(
                        1.8 + Math.cos(angle) * radius,
                        -0.45,
                        -1.2 + Math.sin(angle) * radius
                    );
                    pen.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.1;
                    pen.castShadow = true;
                    scene.add(pen);

                    // Pen caps (top part)
                    const capGeometry = new THREE.CylinderGeometry(0.02, 0.015, 0.08, 8);
                    const capMaterial = new THREE.MeshStandardMaterial({
                        color: color,
                        metalness: 0.7,
                        roughness: 0.2
                    });
                    const cap = new THREE.Mesh(capGeometry, capMaterial);
                    cap.position.set(
                        1.8 + Math.cos(angle) * radius,
                        -0.2,
                        -1.2 + Math.sin(angle) * radius
                    );
                    cap.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.1;
                    scene.add(cap);
                });

                // Clue Board on wall
                const clueBoardGeometry = new THREE.BoxGeometry(5, 3, 0.1);
                const clueBoardMaterial = new THREE.MeshStandardMaterial({
                    color: 0x8b7355,
                    roughness: 0.9
                });
                const clueBoard = new THREE.Mesh(clueBoardGeometry, clueBoardMaterial);
                clueBoard.position.set(-4, 4, -9.9);
                scene.add(clueBoard);

                // Cork texture on clue board
                const corkGeometry = new THREE.PlaneGeometry(4.8, 2.8);
                const corkMaterial = new THREE.MeshStandardMaterial({
                    color: 0xd4a574,
                    roughness: 1
                });
                const cork = new THREE.Mesh(corkGeometry, corkMaterial);
                cork.position.set(-4, 4, -9.85);
                scene.add(cork);

                // Evidence photos on clue board
                const photoGeometry = new THREE.PlaneGeometry(0.8, 0.6);
                const photoPositions = [
                    [-5.5, 5, -9.8],
                    [-4.3, 5, -9.8],
                    [-3.1, 5, -9.8],
                    [-5.5, 4, -9.8],
                    [-4.3, 4, -9.8],
                    [-3.1, 4, -9.8],
                    [-5.5, 3, -9.8],
                    [-4.3, 3, -9.8]
                ];

                photoPositions.forEach((pos, index) => {
                    const photoMaterial = new THREE.MeshStandardMaterial({
                        color: index % 2 === 0 ? 0xffffff : 0xf5f5dc,
                        roughness: 0.6
                    });
                    const photo = new THREE.Mesh(photoGeometry, photoMaterial);
                    photo.position.set(...pos);
                    photo.rotation.z = (Math.random() - 0.5) * 0.1;
                    scene.add(photo);

                    // Pushpin on photo
                    const pinGeometry = new THREE.CylinderGeometry(0.03, 0.03, 0.05, 8);
                    const pinMaterial = new THREE.MeshStandardMaterial({
                        color: index % 3 === 0 ? 0xff0000 : index % 3 === 1 ? 0xffff00 : 0x00ff00,
                        metalness: 0.7,
                        roughness: 0.3
                    });
                    const pin = new THREE.Mesh(pinGeometry, pinMaterial);
                    pin.rotation.x = Math.PI / 2;
                    pin.position.set(pos[0], pos[1] + 0.3, pos[2] + 0.02);
                    scene.add(pin);
                });

                // Red strings connecting photos (like investigation connections)
                const stringMaterial = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2 });
                const connections = [
                    [0, 1], [1, 2], [0, 3], [3, 4], [4, 5], [1, 4], [3, 6], [6, 7]
                ];

                connections.forEach(([from, to]) => {
                    const points = [];
                    points.push(new THREE.Vector3(
                        photoPositions[from][0],
                        photoPositions[from][1],
                        photoPositions[from][2] + 0.01
                    ));
                    points.push(new THREE.Vector3(
                        photoPositions[to][0],
                        photoPositions[to][1],
                        photoPositions[to][2] + 0.01
                    ));
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const line = new THREE.Line(geometry, stringMaterial);
                    scene.add(line);
                });

                // "SUSPECT" label on clue board
                const labelGeometry = new THREE.PlaneGeometry(1.5, 0.3);
                const labelMaterial = new THREE.MeshStandardMaterial({
                    color: 0xff0000,
                    roughness: 0.5
                });
                const label = new THREE.Mesh(labelGeometry, labelMaterial);
                label.position.set(-3.1, 3, -9.79);
                scene.add(label);

                // Wall Monitor
                const wallMonitorFrameGeometry = new THREE.BoxGeometry(4, 2.5, 0.15);
                const wallMonitorFrameMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a1a1a,
                    roughness: 0.4,
                    metalness: 0.7
                });
                const wallMonitorFrame = new THREE.Mesh(wallMonitorFrameGeometry, wallMonitorFrameMaterial);
                wallMonitorFrame.position.set(3, 2.5, -9.85);
                scene.add(wallMonitorFrame);

                const wallScreenGeometry = new THREE.PlaneGeometry(3.7, 2.2);
                const wallScreenMaterial = new THREE.MeshStandardMaterial({
                    color: 0x0a1a2e,
                    roughness: 0.1,
                    emissive: 0x1a3a5a,
                    emissiveIntensity: 0.4
                });
                const wallScreen = new THREE.Mesh(wallScreenGeometry, wallScreenMaterial);
                wallScreen.position.set(3, 2.5, -9.78);
                scene.add(wallScreen);

                } else if (currentScene === 'house') {
                    // HOUSE CRIME SCENE - Dark and ominous

                    // Dim ambient light
                    const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
                    scene.add(ambientLight);

                    // Flickering overhead light
                    const overheadLight = new THREE.PointLight(0xffddaa, 0.8);
                    overheadLight.position.set(0, 5, 0);
                    overheadLight.castShadow = true;
                    overheadLight.shadow.mapSize.width = 2048;
                    overheadLight.shadow.mapSize.height = 2048;
                    scene.add(overheadLight);

                    // Crime scene light from window
                    const windowLight = new THREE.SpotLight(0x8888ff, 0.4);
                    windowLight.position.set(-8, 6, -5);
                    windowLight.angle = Math.PI / 4;
                    windowLight.castShadow = true;
                    scene.add(windowLight);

                    // Floor - wooden planks
                    const floorGeometry = new THREE.PlaneGeometry(25, 25);
                    const floorMaterial = new THREE.MeshStandardMaterial({
                        color: 0x4a3728,
                        roughness: 0.9,
                        metalness: 0.0
                    });
                    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                    floor.rotation.x = -Math.PI / 2;
                    floor.position.y = -2;
                    floor.receiveShadow = true;
                    scene.add(floor);

                    // BLOOD POOLS on floor
                    const bloodGeometry1 = new THREE.CircleGeometry(1.2, 32);
                    const bloodMaterial = new THREE.MeshStandardMaterial({
                        color: 0x8b0000,
                        roughness: 0.4,
                        metalness: 0.3,
                        emissive: 0x330000,
                        emissiveIntensity: 0.2
                    });
                    const bloodPool1 = new THREE.Mesh(bloodGeometry1, bloodMaterial);
                    bloodPool1.rotation.x = -Math.PI / 2;
                    bloodPool1.position.set(2, -1.99, 1);
                    scene.add(bloodPool1);

                    // Second blood pool
                    const bloodGeometry2 = new THREE.CircleGeometry(0.8, 32);
                    const bloodPool2 = new THREE.Mesh(bloodGeometry2, bloodMaterial);
                    bloodPool2.rotation.x = -Math.PI / 2;
                    bloodPool2.position.set(1, -1.99, -1);
                    scene.add(bloodPool2);

                    // Blood splatter (smaller pool)
                    const bloodGeometry3 = new THREE.CircleGeometry(0.4, 32);
                    const bloodPool3 = new THREE.Mesh(bloodGeometry3, bloodMaterial);
                    bloodPool3.rotation.x = -Math.PI / 2;
                    bloodPool3.position.set(3.5, -1.99, 0.5);
                    scene.add(bloodPool3);

                    // FOOTPRINTS - bloody shoe prints
                    const footprintShape = new THREE.Shape();
                    footprintShape.moveTo(0, 0);
                    footprintShape.lineTo(0.3, 0);
                    footprintShape.lineTo(0.35, 0.1);
                    footprintShape.lineTo(0.35, 0.6);
                    footprintShape.quadraticCurveTo(0.35, 0.8, 0.25, 0.85);
                    footprintShape.quadraticCurveTo(0.15, 0.9, 0.05, 0.85);
                    footprintShape.quadraticCurveTo(-0.05, 0.8, -0.05, 0.6);
                    footprintShape.lineTo(-0.05, 0.1);
                    footprintShape.lineTo(0, 0);

                    const footprintGeometry = new THREE.ShapeGeometry(footprintShape);
                    const footprintMaterial = new THREE.MeshStandardMaterial({
                        color: 0x660000,
                        roughness: 0.6,
                        metalness: 0.1
                    });

                    // Create footprint trail leaving the blood pool
                    const footprintPositions = [
                        { x: 2.5, z: 0.5, rotation: 0.2 },
                        { x: 3.0, z: -0.3, rotation: -0.1 },
                        { x: 3.5, z: -1.0, rotation: 0.15 },
                        { x: 4.0, z: -1.8, rotation: -0.05 },
                        { x: 4.3, z: -2.6, rotation: 0.1 },
                        { x: 4.5, z: -3.5, rotation: -0.15 },
                        { x: 4.6, z: -4.3, rotation: 0.0 }
                    ];

                    footprintPositions.forEach((pos, index) => {
                        const footprint = new THREE.Mesh(footprintGeometry, footprintMaterial.clone());
                        footprint.rotation.x = -Math.PI / 2;
                        footprint.rotation.z = pos.rotation;
                        footprint.position.set(pos.x, -1.98, pos.z);
                        // Fade footprints as they get further
                        footprint.material.opacity = 1 - (index * 0.12);
                        footprint.material.transparent = true;
                        scene.add(footprint);

                        // Add right footprint slightly offset
                        if (index > 0 && index % 2 === 0) {
                            const footprintR = new THREE.Mesh(footprintGeometry, footprintMaterial.clone());
                            footprintR.rotation.x = -Math.PI / 2;
                            footprintR.rotation.z = pos.rotation + Math.PI;
                            footprintR.position.set(pos.x - 0.4, -1.98, pos.z);
                            footprintR.material.opacity = 1 - (index * 0.12);
                            footprintR.material.transparent = true;
                            scene.add(footprintR);
                        }
                    });

                    // Walls
                    const wallMaterial = new THREE.MeshStandardMaterial({
                        color: 0x5a5a4a,
                        roughness: 0.95
                    });

                    // Back wall
                    const backWallGeometry = new THREE.PlaneGeometry(25, 12);
                    const backWall = new THREE.Mesh(backWallGeometry, wallMaterial);
                    backWall.position.set(0, 4, -10);
                    backWall.receiveShadow = true;
                    scene.add(backWall);

                    // Left wall
                    const leftWallGeometry = new THREE.PlaneGeometry(25, 12);
                    const leftWall = new THREE.Mesh(leftWallGeometry, wallMaterial);
                    leftWall.rotation.y = Math.PI / 2;
                    leftWall.position.set(-10, 4, 2.5);

                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.1);

                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

                    const rect = renderer.domElement.getBoundingClientRect();
                    const clickX = event.clientX - rect.left;
                    const clickY = event.clientY - rect.top;

                    // Calculate percentage position
                    const clickXPercent = (clickX / rect.width) * 100;
                    const clickYPercent = (clickY / rect.height) * 100;

                    // Check if click is near any hotspot
                    let foundHotspot = null;
                    let closestDistance = Infinity;

                    console.log(`Click at: ${clickXPercent.toFixed(1)}%, ${clickYPercent.toFixed(1)}%`);

                    for (const hotspot of hotspots) {
                        const distance = Math.sqrt(
                            Math.pow(clickXPercent - hotspot.x, 2) +
                            Math.pow(clickYPercent - hotspot.y, 2)
                        );

                        console.log(`  ${hotspot.label}: distance = ${distance.toFixed(1)}% (at ${hotspot.x}%, ${hotspot.y}%)`);

                        if (distance < 15 && distance < closestDistance) { // Within 15% radius (increased from 8%)
                            foundHotspot = hotspot;
                            closestDistance = distance;
                        }
                    }

                    if (foundHotspot) {
                        console.log(`✓ Found hotspot: ${foundHotspot.label} (${closestDistance.toFixed(1)}% away)`);
                    }

                    // Handle different tool interactions
                    if (selectedTool === 'magnifier') {
                        setZoomTarget({ x: clickX, y: clickY, detail: 'Examining...' });

                        if (foundHotspot && foundHotspot.tool === 'magnifier' && !discoveredClues.includes(foundHotspot.id)) {
                            setTimeout(() => {

                                                <div className="grid grid-cols-2 gap-3 mb-4">
                                                    {suspects.map(suspect => (
                                                        <button

                                                                setSelectedSuspect(suspect);
                                                                setShowResult(true);
                                                            }}

                                                                <span className="font-bold"> Shoe:</span> {suspect.shoe}

                                                            <p className="text-gray-400 text-xs">{suspect.details}</p>
                                                        </button>
                                                    ))}
                                                </div>
                                            </>
                                        ) : (
                                            <>

                                                {selectedSuspect.isGuilty ? (
                                                    <div className="bg-green-900 bg-opacity-50 p-6 rounded-lg border-4 border-green-500 mb-4">
                                                        <div className="text-center">
                                                            <div className="text-6xl mb-3">✅</div>

                                                            </p>
                                                        </div>
                                                    </div>

                                                            <div className="text-6xl mb-3">❌</div>
                                                            <h3 className="text-3xl font-bold text-red-400 mb-3">INCORRECT</h3>

                                                    </div>

                                                <div className="text-center">

                                                        🔄 Try Again
                                                    </button>
                                                    <button

                                                            setSelectedSuspect(null);

                                                    </button>

                                                        🔄 Restart Game
                                                    </button>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }
